<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style=" margin-top: -0.25rem;">
          <!-- <h4 class="heading">Create Purchase Request</h4> -->
          <h4 class="heading">
            <ng-container *ngIf="viewMode === false">
              {{ (isNewForm ? 'CONFIG_MODULE.CREATE_GLOBAL_CONFIG' : 'CONFIG_MODULE.UPDATE_GLOBAL_CONFIG') | translate }}
            </ng-container>
          </h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div class="row">
          <div class="col-md-6">
            <button class="btn btn-lg mr-1" type="button" (click)="homePage()"><i class="ft-arrow-left"></i></button>
            <span class="vl"></span>

            <!-- Create Mode: Save + Save as Draft -->
            <ng-container *ngIf="isNewForm && !viewMode">
              <button class="btn btn-sm cstm-ui-table-btn" [disabled]="newGlobalConfigForm.invalid"
                (click)="onSubmit()">
                <i class="ft-plus"></i><label class="ml-1">{{ 'COMMON.SAVE' | translate }}</label>
              </button>

            </ng-container>

            <!-- Update Mode: Update -->
            <ng-container *ngIf="!isNewForm && !viewMode">
              <button class="btn btn-sm cstm-ui-table-btn" [disabled]="newGlobalConfigForm.invalid"
                (click)="onSubmit()">
                <i class="ft-edit-2"></i><label class="ml-1">{{ 'COMMON.UPDATE' | translate }}</label>
              </button>
            </ng-container>

            <!-- <button type="reset" class="btn btn-sm">
              <i class="ft-edit"></i><label class="ml-1 mt-1" for="">Edit</label>
            </button>
            <button type="reset" class="btn btn-sm">
              <i class="ft-trash"></i><label class="ml-1 mt-1" for="">Delete</label>
            </button>
            <button type="reset" class="btn btn-sm">
              <i class="ft-check"></i><label class="ml-1 mt-1" for="">Approval</label>
            </button> -->

          </div>

          <div class="col-md-6 text-right" style="margin-top: 0.3rem;">
            <!-- <button type="reset" class="btn btn-sm mr-2">
              <i class="ft-printer"></i><label class="ml-1 mt-1" for="">Print</label>
            </button> -->

            <!-- <button type="reset" class="btn btn-sm" (click)="openNewEntityModal()">
              <i class="ft-paperclip"></i><label class="ml-1 mt-1" for="">Attachment</label>
              <span class="badge badge-primary ml-1">{{ numberOfAttachments }}</span>
            </button> -->
            <!-- <button type="reset" class="btn btn-sm">
                <i class="ft-settings"></i><label class="ml-1 mt-1" for="">Account Budget Lookup</label>
              </button>
              <button type="reset" class="btn btn-sm">
                <i class="ft-alert-circle"></i><label class="ml-1 mt-1" for="">Exception Policy</label>
              </button> -->

          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">

          <form [formGroup]="newGlobalConfigForm" (ngSubmit)="onSubmit()">
            <div class="row gx-2">

              <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
                <div class="form-group mb-2">
                  <label>{{ 'COMMON.NAME' | translate }}</label>
                  <input type="text" formControlName="name" class="form-control custom-input" [placeholder]="'CONFIG_MODULE.ENTER_NAME' | translate"
                    required />
                </div>
              </div>

              <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
                <div class="form-group mb-2">
                  <label>{{ 'COMMON.VALUE' | translate }}</label>
                  <input type="text" formControlName="value" [placeholder]="'CONFIG_MODULE.ENTER_VALUE' | translate" required
                    class="form-control custom-input" />
                  <!-- <input type="text" formControlName="purchaseRequestNo" placeholder="Enter PR No."
                    class="form-control" /> -->
                </div>
              </div>

              <!-- <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
                <div class="form-group mb-2">
                  <label>Type</label>
                  <input type="text" formControlName="type" class="form-control custom-input" placeholder="Enter Type" required/>
                </div>
              </div> -->

              <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
                <div class="form-group mb-2">
                  <label>{{ 'COMMON.TYPE' | translate }}</label>
                  <select formControlName="type" class="form-control custom-input" required>
                    <option value="" disabled>{{ 'CONFIG_MODULE.SELECT_TYPE' | translate }}</option>
                    <option *ngFor="let t of globalConfigTypes" [value]="t.description">
                      {{ t.description }}
                    </option>
                  </select>

                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
