<div class="modal-header d-flex align-items-center justify-content-between">
  <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
    <i class="ft-edit-2 mr-2 text-white"></i> {{ id != 0 ? 'Update Task' : 'Create Task'}}
  </h5>
  <button type="button" class="modal-close-btn" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
    <i class="ft-x"></i>
  </button>
</div>
<form [formGroup]="myForm" (ngSubmit)="submitForm()">
  <div class="modal-body taskboard-modal">
    <div class="container">
      <fieldset class="form-group position-relative has-icon-left">
        <div class="form-control-position">
          <i class="ft-edit-2"></i>
        </div>
        <input type="text" [formControl]="myForm.controls['title']" formControlName="title" class="form-control"
          id="todoTitle" placeholder="Title" (keydown.enter)="$event.preventDefault()" required #todoTitle>
        <div class="form-control-position control-position-right">
          <i class="ft-edit-2"></i>
        </div>
      </fieldset>
      <fieldset class="form-group position-relative has-icon-left">
        <div class="form-control-position">
          <i class="ft-message-square"></i>
        </div>
        <textarea [formControl]="myForm.controls['message']" formControlName="message" class="form-control"
          id="todoMessage" placeholder="Message" (keydown.enter)="$event.preventDefault()" required #todoMessage>
        <div class="form-control-position control-position-right">
          <i class="ft-message-square"></i>
        </div>
      </textarea>
      </fieldset>
      <fieldset class="form-group position-relative has-icon-left">
        <div class="form-control-position">
          <i class="ft-grid"></i>
        </div>
        <select [formControl]="myForm.controls['type']" formControlName="type" class="form-control" >
          <option>Marketing</option>
          <option>UI-Designing</option>
          <option>Developing</option>
          <option>Management</option>
        </select>
        <div class="form-control-position control-position-right">
          <i class="ft-grid"></i>
        </div>
      </fieldset>
    </div>
  </div>
  <div class="modal-footer taskboard-modal-footer">
    <button type="button" class="modal-btn-cancel" (click)="activeModal.dismiss('Cancel click')">
      <i class="ft-x mr-1"></i> Cancel
    </button>
    <button type="submit" class="modal-btn-save">
      <i class="fa fa-save mr-1"></i> {{ id != 0 ? 'Update' : 'Create'}}
    </button>
  </div>
</form>
