<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <!-- <h4>Announcements</h4> -->
          <h4 class="heading">Purchase Orders</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div>
          <div class="d-flex justify-content-between align-items-center cstm-action-bar">
            <div class="d-flex align-items-center">
              <button class="btn btn-lg mr-1 " type="button" (click)="homePage()">
                <img src="assets/img/svg-icons/back-icon.svg" class="btn-back-icon" alt="Back" /></button>
              <span class="vl" style="position: static !important; display: inline-block !important; height: 22px !important; border-left: 1px solid #D7D7D7 !important; margin: 0 12px 0 8px !important; vertical-align: middle !important;"></span>

              <!-- Submit for Approval Button (Shown only when selected PO's submitter matches logged-in user / main approver is submitter) -->
              <ng-container *ngIf="canShowSubmitForApproval()">
                <button type="button" class="btn btn-sm cstm-ui-table-btn"
                  [disabled]="!canSubmitForApproval()"
                  (click)="onSubmitForApproval()"
                  [ngbTooltip]="getSubmitButtonTooltip()">
                  <img src="assets/img/svg-icons/Submit_icon.svg" class="btn-action-icon" alt="Submit for Approval" />
                  <label class="btn-label">Submit for Approval</label>
                </button>
              </ng-container>

              <!-- Approver Action Buttons (When selected PO awaits current user's approval) -->
              <ng-container *ngIf="canTakeApproverActionOnSelected()">
                <button type="button" class="btn btn-sm cstm-ui-table-btn"
                  (click)="onApproverAction('Approve')"
                  ngbTooltip="Approve selected Purchase Order">
                  <i class="ft-check text-success mr-1"></i>
                  <label class="btn-label">Approve</label>
                </button>

                <button type="button" class="btn btn-sm cstm-ui-table-btn"
                  (click)="onApproverAction('Reject')"
                  ngbTooltip="Reject selected Purchase Order">
                  <img src="assets/img/svg-icons/cancel-icon.svg" class="btn-action-icon" alt="Reject" />
                  <label class="btn-label">Reject</label>
                </button>
              </ng-container>
            </div>

            <div class="d-flex align-items-center me-2">
              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="toggleFilterBar()">
                <img src="assets/img/svg-icons/filter-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Filter</label>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Content -->
       <div *ngIf="showFilterBar" class="filter-bar">
        <div class="d-flex align-items-center justify-content-between pl-3 pr-1 py-2 filter-wrapper">
          <div class="filter-search">
            <!-- <i class="ft-filter search-icon"></i>
            <input type="text" placeholder="Search by keywords" class="form-control form-control-sm search-input"
              [(ngModel)]="searchText"> -->
          </div>

          <div class="d-flex filter-btns-div">
            <div class="dropdown filter-dropdown" ngbDropdown [ngbTooltip]="statusTouched ? 'Status' : null">
              <button class="btn btn-sm filter-btn dropdown-toggle" ngbDropdownToggle>
                <span class="filter-label">{{ !statusTouched ? "Status" : selectedStatusLabel }} </span>
                <i class="ft-chevron-down"></i>
              </button>
              <div class="dropdown-menu" ngbDropdownMenu>
                <button type="button" class="dropdown-item" [class.active]="!statusTouched || selectedStatusLabel === 'All'" (click)="onStatusChange('All')">
                  <span>All</span>
                  <i *ngIf="!statusTouched || selectedStatusLabel === 'All'" class="ft ft-check chart-check-icon"></i>
                </button>
                <button type="button" class="dropdown-item" *ngFor="let s of statuses" [class.active]="statusTouched && selectedStatusLabel === s.description" (click)="onStatusChange(s)">
                  <span>{{ s.description }}</span>
                  <i *ngIf="statusTouched && selectedStatusLabel === s.description" class="ft ft-check chart-check-icon"></i>
                </button>
              </div>
            </div>

            <button class="btn px-1 btn-sm" (click)="showFilterBar = false">✕</button>
          </div>

        </div>
      </div>
          <div  class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
      <ngx-datatable #datatable class="bootstrap core-bootstrap"
        [rows]="purchaseOrderData" [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [columns]="columns"
        [rowHeight]="'auto'" [limit]="pageSize" [count]="totalItems" [externalPaging]="true" [offset]="currentPage - 1"
        (page)="onPageChange($event)" [scrollbarH]="isMobile" [loadingIndicator]="loading" [selected]="chkBoxSelected"
        [selectionType]="SelectionType.checkbox" (select)="customChkboxOnSelect($event)"
        [swapColumns]="false" (sort)="onSort($event)">

        <!-- Checkbox / Selection Column -->
        <ngx-datatable-column
          [width]="50"
          [sortable]="false"
          [canAutoResize]="false"
          [draggable]="false"
          [resizeable]="false"
          cellClass="datatable-checkbox-cell"
          headerClass="datatable-checkbox-cell">
          <ng-template ngx-datatable-header-template>
            <div class="custom-control cstm-checkbox-form">
              <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll($event)" />
            </div>
          </ng-template>
          <ng-template ngx-datatable-cell-template let-row="row" let-isSelected="isSelected"
            let-onCheckboxChangeFn="onCheckboxChangeFn">
            <div class="custom-control cstm-checkbox-form custom-checkbox">
              <input type="checkbox" [checked]="isSelected" (change)="onCheckboxChangeFn($event)" />
            </div>
          </ng-template>
        </ngx-datatable-column>

        <!-- Sr. No -->
        <ngx-datatable-column name="Sr. No." [width]="80" [minWidth]="80" [canAutoResize]="false" [resizeable]="false" [sortable]="false">
          <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
            <span>{{ rowIndex + 1 }}</span>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="PO No." prop="purchaseOrderNo" [flexGrow]="1" [minWidth]="100" [sortable]="false">
          <ng-template ngx-datatable-cell-template let-row="row">
            <a href="javascript:void(0)" (click)="onRowClick(row)">
              {{ row.purchaseOrderNo }}
            </a>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Status" prop="requestStatus" [sortable]="false" [flexGrow]="1" [minWidth]="120">
          <ng-template ngx-datatable-cell-template let-row="row">
            <span [ngClass]="row.statusClass">
              {{ row.requestStatus }}
            </span>
          </ng-template>
        </ngx-datatable-column>
        
        <ngx-datatable-column name="Requisition No." prop="requisitionNo" [sortable]="false" [flexGrow]="2" [minWidth]="140">
        </ngx-datatable-column>

        <!-- <ngx-datatable-column name="Date" prop="date" [width]="50">
                </ngx-datatable-column> -->

        <ngx-datatable-column name="RFQ No." prop="rfqNo" [sortable]="false" [flexGrow]="2" [minWidth]="160">
        </ngx-datatable-column>
        <ngx-datatable-column name="Entity" prop="entityName" [sortable]="false" [flexGrow]="2" [minWidth]="120">
        </ngx-datatable-column>
        <ngx-datatable-column name="Vendor" prop="vendorCompanyName" [sortable]="false" [flexGrow]="1" [minWidth]="120">
        </ngx-datatable-column>
        
        <ngx-datatable-column name="Total Items" prop="itemsCount" [sortable]="false" [flexGrow]="1" [minWidth]="125">
        </ngx-datatable-column>
        <!-- <ngx-datatable-column name="Total Amount" prop="totalAmount" [sortable]="false">
        </ngx-datatable-column> -->

        <ngx-datatable-column name="Date" prop="createdDate" [sortable]="false" [flexGrow]="1" [minWidth]="115">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.createdDate | date:'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>

        <!-- Action Column with Icon to View Approval History -->
        <ngx-datatable-column name="Action" [sortable]="false" [width]="80" [minWidth]="80" [canAutoResize]="false" [draggable]="false" [resizeable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <button type="button" class="btn btn-sm table-action-btn" (click)="openApprovalHistoryModal(row)" ngbTooltip="Approval History">
              <i class="ft-list"></i>
            </button>
          </ng-template>
        </ngx-datatable-column>
        <!-- <ngx-datatable-column name="Amount" prop="amount" [sortable]="false">
                </ngx-datatable-column> -->

        <!-- <ngx-datatable-column name="Comments" prop="comment">
                </ngx-datatable-column>

                <ngx-datatable-column name="Total Amount" prop="amount" [sortable]="false">
                </ngx-datatable-column> -->

      </ngx-datatable>
      </div>
    </div>
  </div>
</section>
