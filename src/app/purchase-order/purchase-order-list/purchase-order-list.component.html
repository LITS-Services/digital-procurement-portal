<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <!-- <h4>Announcements</h4> -->
          <h4 class="heading">{{ 'PO_MODULE.PURCHASE_ORDERS' | translate }}</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div>
          <div class="d-flex justify-content-between align-items-center cstm-action-bar">
            <div>
              <button class="btn btn-lg mr-1 " type="button" (click)="homePage()">
                <i class="ft-arrow-left"></i></button>
              <span class="vl"></span>
            </div>

            <div class="d-flex align-items-center me-2">
              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="toggleFilterBar()">
                <i class="ft-sliders"></i><label class="ml-1 btn-label">{{ 'COMMON.FILTER' | translate }}</label>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Content -->
       <div *ngIf="showFilterBar" class="filter-bar">
        <div class="d-flex align-items-center justify-content-between pl-3 pr-1 py-2 filter-wrapper">
          <div class="filter-search">
          </div>

          <div class="d-flex filter-btns-div">
            <div class="dropdown filter-dropdown" ngbDropdown [ngbTooltip]="statusTouched ? ('COMMON.STATUS' | translate) : null">
              <button class="btn btn-sm filter-btn dropdown-toggle" ngbDropdownToggle>
                <span class="filter-label">{{ !statusTouched ? ('COMMON.STATUS' | translate) : (selectedStatusLabel | statusTranslate) }} </span>
                <i class="ft-chevron-down"></i>
              </button>
              <div class="dropdown-menu" ngbDropdownMenu>
                <button class="dropdown-item" (click)="onStatusChange('All')">
                  {{ 'COMMON.ALL' | translate }}
                </button>
                <button class="dropdown-item" *ngFor="let s of statuses" (click)="onStatusChange(s)">
                  {{ s.description }}
                </button>
              </div>
            </div>

            <button class="btn px-1 btn-sm" (click)="showFilterBar = false">✕</button>
          </div>

        </div>
      </div>
          <div  class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
      <ngx-datatable #datatable class="bootstrap core-bootstrap"
        [rows]="purchaseOrderData" [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [columns]="columns"
        [rowHeight]="'auto'" [limit]="pageSize" [count]="totalItems" [externalPaging]="true" [offset]="currentPage - 1"
        (page)="onPageChange($event)" [scrollbarH]="isMobile" [loadingIndicator]="loading" [selected]="chkBoxSelected"
        [swapColumns]="false" (sort)="onSort($event)" appPermission [appPermFormId]="FORM_IDS.PURCHASE_ORDER" [appPermDisable]="'write'">>

        <!-- Sr. No -->
        <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [flexGrow]="1" [maxWidth]="70" [canAutoResize]="false" [resizeable]="false" [sortable]="false">
          <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
            <span>{{ rowIndex + 1 }}</span>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'PO_MODULE.PO_NO' | translate" prop="purchaseOrderNo" [flexGrow]="1" [minWidth]="100" [sortable]="false">
          <ng-template ngx-datatable-cell-template let-row="row">
            <a href="javascript:void(0)" (click)="onRowClick(row)" appPermission [appPermFormId]="FORM_IDS.PURCHASE_ORDER"
              [appPermDisable]="'write'">
              {{ row.purchaseOrderNo }}
            </a>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'COMMON.STATUS' | translate" prop="requestStatus" [sortable]="false" [flexGrow]="1" [minWidth]="120">
          <ng-template ngx-datatable-cell-template let-row="row">
            <span [ngClass]="row.statusClass">
              {{ row.requestStatus | statusTranslate }}
            </span>
          </ng-template>
        </ngx-datatable-column>
        
        <ngx-datatable-column [name]="'COMMON.REQUISITION_NO' | translate" prop="requisitionNo" [sortable]="false" [flexGrow]="2" [minWidth]="140">
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'COMMON.RFQ_NO' | translate" prop="rfqNo" [sortable]="false" [flexGrow]="2" [minWidth]="160">
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'COMMON.ENTITY' | translate" prop="entityName" [sortable]="false" [flexGrow]="2" [minWidth]="120">
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'COMMON.VENDOR' | translate" prop="vendorCompanyName" [sortable]="false" [flexGrow]="1" [minWidth]="120">
        </ngx-datatable-column>
        
        <ngx-datatable-column [name]="'COMMON.TOTAL_ITEMS' | translate" prop="itemsCount" [sortable]="false" [flexGrow]="1" [minWidth]="80">
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'COMMON.DATE' | translate" prop="createdDate" [sortable]="false" [flexGrow]="1" [minWidth]="100">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.createdDate | date:'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>

      </ngx-datatable>
      </div>
    </div>
  </div>
</section>
