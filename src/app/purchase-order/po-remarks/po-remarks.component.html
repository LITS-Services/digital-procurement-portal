<div class="modal-header d-flex align-items-center justify-content-between">
  <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
    <i class="ft-message-square mr-2 text-white"></i> {{ action }} Purchase Order - {{ purchaseOrderNo }}
  </h5>
  <button type="button" class="modal-close-btn" aria-label="Close" (click)="cancel()">
    <i class="ft-x"></i>
  </button>
</div>

<div class="modal-body">
  <div class="form-group mb-0">
    <label class="form-label font-weight-bold mb-1">Remarks</label>
    <textarea [(ngModel)]="remarks"
              class="form-control"
              rows="4"
              placeholder="Enter your remarks here..."></textarea>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="modal-btn-cancel" (click)="cancel()">
    <i class="ft-x mr-1"></i> Cancel
  </button>
  <button type="button" class="modal-btn-save" [ngClass]="action === 'Reject' ? 'btn-danger' : 'btn-success'" (click)="saveRemarks()">
    <i class="fa fa-save mr-1"></i> {{ action }}
  </button>
</div>
