@if (invoiceDetails?.invoiceNo) {
<div class="card cstm-ui-card mb-4">
  <div class="card-body">

    <div class="d-flex justify-content-end align-items-end mb-3">
    <button class="btn btn-primary btn-large" (click)="downloadInvoice(invoiceDetails.id, invoiceDetails.invoiceNo)" ngbTooltip="View/Download Invoice">
      <i class="fa-regular fa-file-pdf"></i>
    </button>
  </div>

    <div class="row">
      <div class="col-lg-4 col-md-6 mb-3">
        <label>Invoice No</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.invoiceNo" disabled>
      </div>

      <div class="col-lg-4 col-md-6 mb-3">
        <label>PO No</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.purchaseOrderNo" disabled>
      </div>

      <div class="col-lg-4 col-md-6 mb-3">
        <label>Vendor</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.vendorName" disabled>
      </div>

      <div class="col-lg-4 col-md-6 mb-3">
        <label>Invoice Date</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.invoiceDate | date:'yyyy-MM-dd'" disabled>
      </div>

      <div class="col-lg-4 col-md-6 mb-3">
        <label>GRN No</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.grNumber" disabled>
      </div>

      <!-- <div class="col-lg-4 col-md-6 mb-3">
          <label>Delivery Challan No</label>
          <input class="form-control form-control-sm" [value]="invoiceDetails?.deliveryChallan" disabled>
        </div> -->

      <div class="col-lg-4 col-md-6 mb-3">
        <label>Payment Terms</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.paymentTerms" disabled>
      </div>

      <div class="col-lg-4 col-md-6 mb-3">
        <label>Due Date</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.dueDate | date:'yyyy-MM-dd'" disabled>
      </div>

      <div class="col-lg-4 col-md-6 mb-3">
        <label>Status</label>
        <input class="form-control form-control-sm" [value]="invoiceDetails?.requestStatus" disabled>
      </div>

      <div class="col-lg-8 col-md-6 mb-3">
        <label>Remarks</label>
        <textarea class="form-control form-control-sm" disabled rows="2">{{ invoiceDetails?.remarks }}</textarea>
      </div>
    </div>
  </div>
</div>

<!-- Items Section -->
<h5 class="heading mb-3 fw-bold" (click)="toggleItems()" style="cursor: pointer;">
  Items
  <i class="fa" [ngClass]="itemsExpanded ? 'fa-chevron-down' : 'fa-chevron-up'" style="font-size: 12px;"></i>
</h5>

<div [@expandCollapse]="itemsExpanded ? 'expanded' : 'collapsed'" style="overflow: hidden;">
  <div class="card cstm-ui-card border-0 shadow-sm">
    <div class="card-body p-0">

      <div class="table-responsive">
        <table class="table table-sm pro-table mb-0">
          <thead>
            <tr>
              <th>Item</th>
              <th class="text-center">Total Qty</th>
              <!-- <th class="text-end">Unit Price</th> -->
              <th class="text-end">Total Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of invoiceDetails?.invoiceItems">
              <td>{{ item.itemName }}</td>
              <td class="text-center">{{ item.totalQuantity }}</td>
              <!-- <td class="text-end">{{ item.price | number:'1.2-2' }}</td> -->
              <td class="text-end fw-bold">{{ item.totalAmount | number:'1.2-2' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
}

@else {
  <div class="empty-state">
    <i class="fa fa-receipt empty-icon"></i>
    <h5 class="empty-message">Invoice has not been sent for payment yet</h5>
    <p class="empty-submessage">Please check back later or contact the responsible team.</p>
  </div>
}
