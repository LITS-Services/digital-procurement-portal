      </div>

      <div class="summary-item">
  <div class="label fw-bold text-muted">Average Rating</div>
  <div class="rating-value-wrapper text-center">
    <span class="number fw-bold">{{ avgRating.toFixed(1) }}</span>
    <span class="avg-rating-stars">
      <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
        <i class="fa" [ngClass]="{
            'fa-star text-warning': getStarFill(i + 1) === 100,
            'fa-star-half-alt text-warning': getStarFill(i + 1) > 0 && getStarFill(i + 1) < 100,
            'fa-star-o text-muted': getStarFill(i + 1) === 0
          }"></i>
      </ng-container>
    </span>
  </div>
</div>


      <div class="vertical-divider"></div>

      <!-- Rating Bars -->
      <div class="rating-bars-section">
        <div *ngFor="let star of [5,4,3,2,1]" class="rating-bar-row">

          <!-- Star icon column -->
          <div class="star-col">
            <i class="fa fa-star text-warning"></i>
          </div>

          <!-- Number column -->
          <div class="number-col">
            {{ star }}
          </div>

          <!-- Bar + count column -->

              <div class="progress-bar" [ngClass]="'bar-' + star"

            </div>
            <div class="bar-count">
              {{ getRatingCount(star - 1, star) }}
            </div>
          </div> -->
<!-- Bar + count column -->
    <div class="bar-col">
      <div class="progress">
        <div class="progress-bar" 
             [ngClass]="'bar-' + star"
             >
        </div>
      </div>
      <div class="bar-count">
        {{ getRatingCount(star - 1, star) }}
      </div>
    </div>





        </div>
      </div>


    </div>

    <!-- ===== REVIEW LIST ===== -->
<div class="review-list">
  <div *ngFor="let r of ratingData" class="review-item">
    <div class="review-row">

      <!-- Created By column -->
      <div class="created-by">
        <div class="fw-bold">{{ r.createdBy }}</div>
        <div class="text-muted small">{{ r.createdByEmail || '' }}</div>
      </div>

      <!-- Stars + Date + Comment column -->
      <div class="review-right">
        <!-- Stars + Date -->
        <div class="stars-date d-flex align-items-center mb-1">
          <div class="stars me-2" style="display: flex; gap: 2px;">
            <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
              <div class="star-container">
                <i class="fa fa-star-o text-muted"></i>
                <div class="star-fill" [style.width.%]="getReviewStarFill(r.rating, i + 1)">
                  <i class="fa fa-star text-warning"></i>
                </div>
              </div>
            </ng-container>
          </div>
          <div class="review-date text-muted small">{{ r.createdDate | date:'yyyy-MM-dd' }}</div>
        </div>

        <!-- Comment -->
        <div class="review-comment text-muted small">
          {{ r.comment }}
        </div>
      </div>

    </div>
    <hr />
  </div>
</div>



  </div>
</div>
