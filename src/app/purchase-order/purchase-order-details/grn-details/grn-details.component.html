<!-- @if (isShipmentAvailable) { -->
<div class="card cstm-ui-card mb-4" [formGroup]="form">
  <div class="card-body">

    <!-- Header Row -->
    <div class="d-flex justify-content-end align-items-start mb-3">
      <button
  class="btn btn-primary"
  (click)="save()"
  [disabled]="isGrnSubmitted"
>
  {{ isGrnSubmitted ? 'GRN Submitted' : 'Submit GRN' }}
</button>

    </div>

    <div class="row mb-3">
        <div class="col-md-4 mb-3">
        <label class="form-label small">GRN No</label>
        <input class="form-control form-control-sm" formControlName="grNumber" disabled>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label small">PO No</label>
        <input class="form-control form-control-sm" formControlName="purchaseOrderNo" disabled>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label small">Vendor Name</label>
        <input class="form-control form-control-sm" formControlName="vendorName" disabled>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label small">Receiver Name</label>
        <input class="form-control form-control-sm" formControlName="receiverName" disabled>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label small">Status</label>
        <input class="form-control form-control-sm" formControlName="requestStatus" disabled>
      </div>

      <div class="col-md-8 mb-3">
        <label class="form-label small">Remarks</label>
        <textarea class="form-control form-control-sm" rows="2" formControlName="remarks"></textarea>
      </div>
    </div>

    <!-- Items Section -->
    <h5 class="heading mb-3 fw-bold" (click)="toggleItems()" style="cursor: pointer;">
      Items
      <i class="fa" [ngClass]="itemsExpanded ? 'fa-chevron-down' : 'fa-chevron-up'" style="font-size: 12px;"></i>
    </h5>

    <div [@expandCollapse]="itemsExpanded ? 'expanded' : 'collapsed'" style="overflow: hidden;">
      <div class="card cstm-ui-card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm pro-table mb-0">
              <thead>
                <tr>
                  <th>Item</th>
                  <th class="text-center">Ordered Qty</th>
                  <th class="text-center">Received Qty</th>
                  <th class="text-center">Received Date</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody formArrayName="items">
                <tr *ngFor="let item of itemsForm.controls; let i = index" [formGroupName]="i">
                  <td>{{ item.get('itemName')?.value }}</td>
                  <td class="text-center">{{ item.get('orderedQty')?.value }}</td>
                  <td class="text-center">{{ item.get('receivedQuantity')?.value }}</td>
                  <td class="text-center">
                    <input type="date" class="form-control form-control-sm" formControlName="receivedDate">
                  </td>
                  <td>
                    <input type="text" class="form-control form-control-sm" formControlName="remarks">
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
