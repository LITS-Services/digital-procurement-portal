<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">Users</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div class="row">
          <div class="d-flex justify-content-between align-items-center cstm-action-bar">
            <!-- Back Button -->
            <div>
              <button class="btn btn-lg mr-1" type="button" (click)="homePage()">
                <img src="assets/img/svg-icons/back-icon.svg" class="btn-back-icon" alt="Back" />
              </button>
              <span class="vl"></span>
      
              <!-- Edit Button (Top) -->
              <button *ngIf="!isEditButtonDisabled" type="button" class="btn btn-sm cstm-ui-table-btn"
                (click)="editSelectedRow()" appPermission [appPermFormId]="FORM_IDS.PROCUREMENT_USERS"
                [appPermDisable]="'write'" [appPermHide]="true">
                <img src="assets/img/svg-icons/update-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Edit User</label>
              </button>
              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="registerUser()" appPermission
                [appPermFormId]="FORM_IDS.PROCUREMENT_USERS" [appPermDisable]="'write'" [appPermHide]="true">
                <img src="assets/img/svg-icons/create-user-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Register User</label>
              </button>
            </div>
            <div class="d-flex align-items-center">
              <button type="button" class=" me-2 btn btn-sm cstm-ui-table-btn" (click)="toggleFilterBar()">
                <img src="assets/img/svg-icons/filter-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Filter</label>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Table -->
      <div *ngIf="showFilterBar" class="filter-bar">
        <div class="d-flex align-items-center justify-content-between pl-3 pr-1 py-2 filter-wrapper">
          <div class="filter-search">
          </div>
      
          <div class="d-flex filter-btns-div">
            <div class="dropdown filter-dropdown" ngbDropdown [ngbTooltip]="roleTouched ? 'Role' : null">
              <button class="btn btn-sm filter-btn dropdown-toggle" ngbDropdownToggle>
                <span class="filter-label">{{ !roleTouched ? "Role" : selectedRoleLabel }} </span>
                <i class="ft-chevron-down"></i>
              </button>
              <div class="dropdown-menu" ngbDropdownMenu>
                <button type="button" class="dropdown-item" [class.active]="!roleTouched || selectedRoleLabel === 'All'" (click)="onRoleChange('All')">
                  <span>All</span>
                  <i *ngIf="!roleTouched || selectedRoleLabel === 'All'" class="ft ft-check chart-check-icon"></i>
                </button>
                <button type="button" class="dropdown-item" *ngFor="let s of roles" [class.active]="roleTouched && selectedRoleLabel === s.description" (click)="onRoleChange(s)">
                  <span>{{ s.description }}</span>
                  <i *ngIf="roleTouched && selectedRoleLabel === s.description" class="ft ft-check chart-check-icon"></i>
                </button>
              </div>
            </div>
            <button class="btn px-1 btn-sm" (click)="showFilterBar = false">✕</button>
          </div>
        </div>
      </div>

      <div class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
      <ngx-datatable #datatable class="bootstrap core-bootstrap" [rows]="tenderingData"
        [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [limit]="10"
        [scrollbarH]="isMobile" [loadingIndicator]="loading" [selected]="chkBoxSelected" [swapColumns]="false"
        [selectionType]="SelectionType.checkbox" (sort)="onSort($event)" (select)="customChkboxOnSelect($event)">

        <!-- Checkbox Column -->
        <ngx-datatable-column  [minWidth]="50" [maxWidth]="50" [sortable]="false" [canAutoResize]="false" [draggable]="false"
          [resizeable]="false">
          <ng-template ngx-datatable-header-template>
            <div class="custom-control">
              <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll($event)" />
            </div>
          </ng-template>
          <ng-template ngx-datatable-cell-template let-isSelected="isSelected"
            let-onCheckboxChangeFn="onCheckboxChangeFn">
            <div class="custom-control cstm-checkbox-form">
              <input type="checkbox" [checked]="isSelected" (change)="onCheckboxChangeFn($event)" />
            </div>
          </ng-template>
        </ngx-datatable-column>

        <!-- Sr No -->
        <ngx-datatable-column name="Sr. No." [width]="90" [minWidth]="90" [canAutoResize]="false" [resizeable]="false">
          <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
            {{ rowIndex + 1 }}
          </ng-template>
        </ngx-datatable-column>

        <!-- Full Name -->
        <ngx-datatable-column name="Full Name" prop="fullName" [flexGrow]="2" [minWidth]="140"></ngx-datatable-column>

        <!-- Username -->
        <ngx-datatable-column name="Username" prop="userName" [flexGrow]="1" [minWidth]="180"></ngx-datatable-column>

        <!-- Email -->
        <ngx-datatable-column name="Email" prop="email" [flexGrow]="1" [minWidth]="200"></ngx-datatable-column>

        <!-- Phone -->
        <ngx-datatable-column name="Phone" prop="phoneNumber" [flexGrow]="1" [minWidth]="120"></ngx-datatable-column>

        <!-- Status -->
        <!-- <ngx-datatable-column name="Status" prop="isDeleted" [flexGrow]="1" [minWidth]="90" [maxWidth]="100">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span [ngClass]="row.isDeleted ? 'badge badge-danger' : 'badge badge-success'">
              {{ row.isDeleted ? 'In Active' : 'Active' }}
            </span> </ng-template>
        </ngx-datatable-column> -->
        <ngx-datatable-column name="Status" prop="status" [flexGrow]="1" [minWidth]="120">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="chip" [ngClass]="mapStatusKey(row.status)">
              {{ row.status }}
            </span>
          </ng-template>
        </ngx-datatable-column>

      </ngx-datatable>
      </div>

    </div>
  </div>
</section>
