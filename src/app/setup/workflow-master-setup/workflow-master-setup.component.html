<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">{{ 'SETUP_MODULE.WORKFLOW_SETUP' | translate }}</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div class="row">
          <div class="col-md-6">
            <button class="btn btn-lg mr-1" type="button" (click)="homePage()">
              <i class="ft-arrow-left"></i>
            </button>
            <span class="vl"></span>
            <button type="button" class="btn btn-sm cstm-ui-table-btn" [ngbTooltip]="'SETUP_MODULE.CREATE_WORKFLOW_TOOLTIP' | translate"
              (click)="setupnewWorkflow()" appPermission [appPermFormId]="FORM_IDS.WORKFLOW_SETUP"
              [appPermDisable]="'write'">
              <i class="ft-plus"></i><label class="ml-1">{{ 'COMMON.CREATE' | translate }}</label>
            </button>
            <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="onUpdate()" appPermission
              [appPermFormId]="FORM_IDS.WORKFLOW_SETUP" [appPermDisable]="'write'">
              <i class="ft-edit"></i><label class="ml-1">{{ 'COMMON.EDIT' | translate }}</label>
            </button>
            <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="openDeleteModal()" appPermission
              [appPermFormId]="FORM_IDS.WORKFLOW_SETUP" [appPermDisable]="'delete'">
              <i class="ft-trash"></i><label class="ml-1">{{ 'COMMON.DELETE' | translate }}</label>
            </button>
          </div>
        </div>
      </div>

      <!-- Data Table -->
      <div class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
        <ngx-datatable #datatable class="bootstrap core-bootstrap" [rows]="workflowMasterList" [columnMode]="'force'"
          [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [scrollbarH]="isMobile" [limit]="15"
          [loadingIndicator]="loading" [selected]="chkBoxSelected" [selectionType]="SelectionType.checkbox"
          (sort)="onSort($event)" (select)="customChkboxOnSelect($event)">

          <!-- Checkbox Column -->
          <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false" [draggable]="false"
            [resizeable]="false">
            <ng-template ngx-datatable-header-template>
              <!-- <div class="custom-control cstm-checkbox-form">
              <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll($event)" />
            </div> -->
            </ng-template>
            <ng-template ngx-datatable-cell-template let-isSelected="isSelected"
              let-onCheckboxChangeFn="onCheckboxChangeFn">
              <div class="custom-control cstm-checkbox-form custom-checkbox ">
                <input type="checkbox" [checked]="isSelected" (change)="onCheckboxChangeFn($event)" />
              </div>
            </ng-template>
          </ngx-datatable-column>

          <!-- Sr. No -->
          <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [width]="50" [resizeable]="false">
            <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
              <span>{{ rowIndex + 1 }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Request Info -->
          <ngx-datatable-column [name]="'COMMON.NAME' | translate" prop="workflowName" [flexGrow]="1" [minWidth]="140"></ngx-datatable-column>
          <ngx-datatable-column [name]="'SETUP_MODULE.DOCUMENT' | translate" prop="workflowType" [flexGrow]="1"
            [minWidth]="160"></ngx-datatable-column>
          <ngx-datatable-column [name]="'COMMON.STATUS' | translate" prop="isActive" [flexGrow]="1" [minWidth]="120">
            <!-- <ng-template ngx-datatable-cell-template let-row="row">
            <span>
              {{ row.isActive ? 'Active' : 'In Active' }}
            </span>
          </ng-template> -->
            <ng-template ngx-datatable-cell-template let-row="row">
              <span [ngClass]="row.statusClass">
                {{ row.isActive | statusTranslate }}
              </span>
            </ng-template>
          </ngx-datatable-column>

          <ngx-datatable-column [name]="'SETUP_MODULE.APPROVER' | translate" prop="createdDate" [flexGrow]="1" [minWidth]="100" [maxWidth]="120">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button class="btn btn-primary btn-sm position-relative" (click)="openApproverModal(row)">
                <i class="ft-user-check"></i>
              </button>
            </ng-template>
          </ngx-datatable-column>

        </ngx-datatable>
      </div>
    </div>
  </div>
</section>

<!-- Delete Modal -->
<ng-template #deleteModal let-c="close" let-d="dismiss">
  <div class="modal-header d-flex align-items-center justify-content-between">
    <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
      <i class="ft-trash-2 mr-2 text-white"></i> Delete Confirmation
    </h5>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="d('Cross click')">
      <i class="ft-x"></i>
    </button>
  </div>
  <div class="modal-body">
    <p>Are you sure you want to delete the selected records?</p>
    <ul>
      <li *ngFor="let id of idsToDelete">{{ id }}</li>
    </ul>
  </div>
  <div class="modal-footer">
    <button type="button" class="modal-btn-cancel" (click)="c('Cancel click')">
      <i class="ft-x mr-1"></i> Cancel
    </button>
    <button type="button" class="btn btn-danger d-inline-flex align-items-center" style="height: 38px; border-radius: 8px; padding: 0 1.25rem; font-size: 13.5px; font-weight: 600;" (click)="confirmDelete()">
      <i class="ft-trash-2 mr-1"></i> Delete
    </button>
  </div>
</ng-template>
