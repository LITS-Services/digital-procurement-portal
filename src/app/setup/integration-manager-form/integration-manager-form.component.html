<section>
  <div class="row">
    <div class="col-12">
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">{{ isEditMode ? ('SETUP_MODULE.UPDATE_INTEGRATION' | translate) : ('SETUP_MODULE.CREATE_INTEGRATION' | translate) }}</h4>
        </div>
      </div>

      <div class="card cstm-ui-card">
        <div class="row">
          <div class="col-md-6">
            <button class="btn btn-lg mr-1" type="button" (click)="homePage()"><i class="ft-arrow-left"></i></button>
            <span class="vl"></span>
            <button class="btn btn-sm cstm-ui-table-btn" [disabled]="integrationForm.invalid || loading" (click)="onSave()">
              <i [ngClass]="isEditMode ? 'ft-edit-2' : 'ft-plus'"></i>
              <label class="ml-1">{{ isEditMode ? ('COMMON.UPDATE' | translate) : ('COMMON.SAVE' | translate) }}</label>
            </button>
          </div>
        </div>
      </div>

      <div class="card integration-form-card">
        <div class="card-body">
          <form [formGroup]="integrationForm" (ngSubmit)="onSave()">
            <div class="row gx-3">
              <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="form-group mb-2">
                  <label>{{ 'SETUP_MODULE.INTEGRATION_NAME' | translate }}</label>
                  <input type="text" formControlName="name" class="form-control custom-input"
                    [placeholder]="'SETUP_MODULE.ERP_SYNC_SERVICE_EG' | translate" />
                </div>
              </div>

              <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="form-group mb-2">
                  <label>{{ 'COMMON.CODE' | translate }}</label>
                  <input type="text" formControlName="code" class="form-control custom-input"
                    [class.readonly-disabled-look]="isEditMode"
                    [readonly]="isEditMode"
                    [placeholder]="'SETUP_MODULE.ERP_SYNC_CODE_EG' | translate" />
                </div>
              </div>

              <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="form-group mb-2">
                  <label>{{ 'SETUP_MODULE.INTERVAL_TYPE' | translate }}</label>
                  <select formControlName="intervalType" class="form-control custom-input">
                    <option [ngValue]="null" disabled>{{ 'SETUP_MODULE.SELECT_INTERVAL_TYPE' | translate }}</option>
                    <option *ngFor="let intervalType of intervalTypeOptions" [value]="intervalType.value">
                      {{ intervalType.label }}
                    </option>
                  </select>
                </div>
              </div>

              <div class="col-lg-6 col-md-6 col-sm-12">
                <div class="form-group mb-2">
                  <label>{{ 'SETUP_MODULE.INTERVAL' | translate }}</label>
                  <input type="number" formControlName="interval" min="1" class="form-control custom-input"
                    [placeholder]="'SETUP_MODULE.INTERVAL_EG' | translate" />
                </div>
              </div>
              <div class="col-12">
                <div class="form-group mb-3">
                  <label>{{ 'SETUP_MODULE.ENDPOINT_URL' | translate }}</label>
                  <input type="text" formControlName="url" class="form-control custom-input"
                    [placeholder]="'SETUP_MODULE.URL_EG' | translate" />
                </div>
              </div>

              <div class="col-6 mt-2">
                <div class="form-group mb-2">
                  <div class="status-row">
                    <div class="status-meta">
                      <div class="status-title">{{ integrationForm.get('isActive')?.value ? ('COMMON.ACTIVE' | translate) : ('COMMON.INACTIVE' | translate) }}</div>
                      <div class="status-subtitle">{{ 'SETUP_MODULE.ENABLE_SCHEDULE' | translate }}</div>
                    </div>
                    <label class="switch">
                      <input type="checkbox" id="integrationIsActive" formControlName="isActive">
                      <span class="slider round"></span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
