<div class="modal-header d-flex align-items-center justify-content-between">
    <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
        <i class="ft-users mr-2 text-white"></i> {{ 'SETUP_MODULE.RECEIVERS' | translate }}
    </h5>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeDialog()">
        <i class="ft-x"></i>
    </button>
</div>

<div class="modal-body">
    <div class="datatable-view animate-slide-in">
        <ngx-datatable class="bootstrap" [rows]="receiversList" [columnMode]="ColumnMode.force" [headerHeight]="50"
            [footerHeight]="50" [rowHeight]="'auto'" [selectionType]="SelectionType.checkbox"
            [(selected)]="chkBoxSelected">

            <!-- Full Name -->
            <ngx-datatable-column [name]="'COMMON.NAME' | translate" prop="fullName"></ngx-datatable-column>

            <!-- Email -->
            <ngx-datatable-column [name]="'COMMON.EMAIL' | translate" prop="email"></ngx-datatable-column>

            <!-- Created Date -->
            <ngx-datatable-column [name]="'SETUP_MODULE.CREATED_DATE' | translate">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ row.createdOn | date:'short':'UTC' }}
                </ng-template>

            </ngx-datatable-column>

        </ngx-datatable>

    </div>
</div>
<div class="modal-footer">
    <button type="button" class="modal-btn-cancel" (click)="closeDialog()">
        <i class="ft-x mr-1"></i> {{ 'COMMON.CLOSE' | translate }}
    </button>
</div>
