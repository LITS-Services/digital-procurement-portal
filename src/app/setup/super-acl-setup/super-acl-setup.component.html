<section>
  <div class="row">
    <div class="col-12">

      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">{{ 'SETUP_MODULE.SUPER_ACL' | translate }}</h4>
        </div>
      </div>

      <div class="card cstm-ui-card">
        <div class="row">
          <div class="col-md-6">
            <button class="btn btn-lg mr-1" type="button" (click)="homePage()">
              <i class="ft-arrow-left"></i>
            </button>
            <span class="vl"></span>
          </div>
        </div>
      </div>

      <div class="card cstm-ui-card super-acl-toolbar-card mb-2">
        <div class="d-flex flex-wrap align-items-center justify-content-between w-100 toolbar-row">
          <div class="d-flex align-items-center flex-wrap role-group">
            <button type="button" class="role-trigger"
              [ngClass]="{ 'role-active': statusFilter === '' }"
              (click)="setStatusFilter('')">
              {{ 'COMMON.ALL' | translate }}
            </button>
            <button type="button" class="role-trigger"
              [ngClass]="{ 'role-active': statusFilter === 'active' }"
              (click)="setStatusFilter('active')">
              {{ 'COMMON.ACTIVE' | translate }}
            </button>
            <button type="button" class="role-trigger"
              [ngClass]="{ 'role-active': statusFilter === 'inactive' }"
              (click)="setStatusFilter('inactive')">
              {{ 'COMMON.INACTIVE' | translate }}
            </button>
          </div>

          <div class="super-acl-search">
            <i class="fa fa-search"></i>
            <input type="text"
              [(ngModel)]="search"
              (ngModelChange)="onSearchChange()"
              [placeholder]="'SETUP_MODULE.SEARCH_FORM_ROUTE' | translate" />
          </div>
        </div>
      </div>

      <div class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
        <div class="finalized-alert">
          <div class="alert-icon">
            <i class="fa fa-lock"></i>
          </div>
          <div class="alert-text">
            <p>{{ 'SETUP_MODULE.SUPER_ACL_NOTICE' | translate }}</p>
          </div>
        </div>

        <ngx-datatable #datatable class="bootstrap core-bootstrap"
          [rows]="formList"
          [columns]="[]"
          [columnMode]="'force'"
          [headerHeight]="50"
          [footerHeight]="50"
          [rowHeight]="50"
          [limit]="10"
          [scrollbarH]="isMobile">

          <ngx-datatable-column [name]="'SETUP_MODULE.FORM' | translate" prop="name" [flexGrow]="2" [minWidth]="220" [sortable]="false">
            <ng-template ngx-datatable-cell-template let-row="row">
              <div class="super-acl-form-name">{{ row.name }}</div>
            </ng-template>
          </ngx-datatable-column>

          <ngx-datatable-column [name]="'SETUP_MODULE.PATH' | translate" prop="route" [flexGrow]="2" [minWidth]="240" [sortable]="false">
            <ng-template ngx-datatable-cell-template let-row="row">
              <div class="super-acl-form-route">{{ row.route }}</div>
            </ng-template>
          </ngx-datatable-column>

          <ngx-datatable-column [name]="'COMMON.ACTIVE' | translate" prop="isActive" [flexGrow]="1" [minWidth]="120" [sortable]="false">
            <ng-template ngx-datatable-cell-template let-row="row">
              <label class="toggle-switch" (click)="$event.stopPropagation()">
                <input type="checkbox"
                  [checked]="row.isActive"
                  [disabled]="isSaving(row)"
                  (change)="toggleActive(row)" />
                <span class="toggle-slider"></span>
              </label>
            </ng-template>
          </ngx-datatable-column>

          <ngx-datatable-column [name]="'COMMON.STATUS' | translate" prop="isActive" [flexGrow]="1" [minWidth]="120" [sortable]="false">
            <ng-template ngx-datatable-cell-template let-row="row">
              <span class="status-chip" [class.status-active]="row.isActive" [class.status-inactive]="!row.isActive">
                {{ isSaving(row) ? ('COMMON.SAVING' | translate) : (row.isActive | statusTranslate) }}
              </span>
            </ng-template>
          </ngx-datatable-column>

        </ngx-datatable>
      </div>
    </div>
  </div>
</section>
