<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">{{ 'SETUP_MODULE.VENDOR_ONBOARDING_SETUP' | translate }}</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div class="row">
          <div class="col-md-6">
            <button class="btn btn-lg mr-1" type="button" (click)="homePage()">
              <i class="ft-arrow-left"></i>
            </button>
            <span class="vl"></span>
            <button type="button" class="btn btn-sm cstm-ui-table-btn" [ngbTooltip]="'SETUP_MODULE.CREATE_WORKFLOW_TOOLTIP' | translate" appPermission
              [appPermFormId]="FORM_IDS.VENDOR_ONBOARDING" [appPermDisable]="'write'" (click)="NewVendorOnboarding()">
              <i class="ft-plus"></i><label class="ml-1">{{ 'COMMON.CREATE' | translate }}</label>
            </button>
            <button type="button" class="btn btn-sm cstm-ui-table-btn" appPermission
              [appPermFormId]="FORM_IDS.VENDOR_ONBOARDING" [appPermDisable]="'write'" (click)="onUpdate()">
              <i class="ft-edit"></i><label class="ml-1">{{ 'COMMON.EDIT' | translate }}</label>
            </button>
            <button type="button" class="btn btn-sm cstm-ui-table-btn" appPermission
              [appPermFormId]="FORM_IDS.VENDOR_ONBOARDING" [appPermDisable]="'delete'" (click)="openDeleteModal()">
              <i class="ft-trash"></i><label class="ml-1">{{ 'COMMON.DELETE' | translate }}</label>
            </button>
            <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="refreshData()">
              <i class="ft-refresh-cw"></i><label class="ml-1">{{ 'COMMON.REFRESH' | translate }}</label>
            </button>
          </div>
        </div>
      </div>

      <!-- Data Table -->
      <div class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
        <ngx-datatable #datatable class="bootstrap core-bootstrap" [rows]="vendorOnboardingData" [columnMode]="'force'"
          [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [scrollbarH]="isMobile" [limit]="15"
          [selected]="chkBoxSelected" [selectionType]="SelectionType.checkbox" (sort)="onSort($event)"
          (select)="customChkboxOnSelect($event)">

          <!-- Checkbox Column -->
          <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false" [draggable]="false"
            [resizeable]="false">
            <ng-template ngx-datatable-header-template>
              <!-- <div class="custom-control cstm-checkbox-form">
                <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll($event)" />
              </div> -->
            </ng-template>
            <ng-template ngx-datatable-cell-template let-row="row" let-isSelected="isSelected"
              let-onCheckboxChangeFn="onCheckboxChangeFn">
              <div class="custom-control cstm-checkbox-form custom-checkbox">
                <input type="checkbox" [checked]="isSelected" (change)="onCheckboxChangeFn($event)" />
              </div>
            </ng-template>
          </ngx-datatable-column>

          <!-- Sr. No -->
          <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [width]="50" [resizeable]="false">
            <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
              <span>{{ rowIndex + 1 }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Setup Name -->
          <ngx-datatable-column [name]="'SETUP_MODULE.SETUP_NAME' | translate" prop="setupName" [flexGrow]="1" [minWidth]="100">
            <ng-template ngx-datatable-cell-template let-value="value">
              <span>{{ value || 'N/A' }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Description -->
          <ngx-datatable-column [name]="'COMMON.DESCRIPTION' | translate" prop="description" [flexGrow]="2" [minWidth]="350">
            <ng-template ngx-datatable-cell-template let-value="value">
              <span [ngbTooltip]="value">{{ value }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Status -->
          <ngx-datatable-column [name]="'COMMON.STATUS' | translate" prop="status" [flexGrow]="1" [minWidth]="120">
            <ng-template ngx-datatable-cell-template let-row="row">
              <span [ngClass]="row.statusClass">
                {{ row.status | statusTranslate }}
              </span>
            </ng-template>
          </ngx-datatable-column>

          <ngx-datatable-column [name]="'SETUP_MODULE.RECEIVERS' | translate" prop="Receivers" [flexGrow]="1" [minWidth]="100" [maxWidth]="150">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button class="btn btn-primary btn-sm position-relative" (click)="openReceiversModal(row)">
                <i class="ft-users"></i>
              </button>
            </ng-template>
          </ngx-datatable-column>


        </ngx-datatable>
      </div>

    </div>
  </div>
</section>

<!-- Delete Modal -->
<ng-template #deleteModal let-c="close" let-d="dismiss">
  <div class="modal-header d-flex align-items-center justify-content-between">
    <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
      <i class="ft-trash-2 mr-2 text-white"></i> {{ 'COMMON.DELETE_CONFIRMATION' | translate }}
    </h5>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="d('Cross click')">
      <i class="ft-x"></i>
    </button>
  </div>
  <div class="modal-body">
    <p>{{ 'SETUP_MODULE.DELETE_VENDOR_ONBOARDING_CONFIRM' | translate }}</p>
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let name of getSelectedSetupNames()">
        {{ name }}
      </li>
    </ul>
  </div>
  <div class="modal-footer">
    <button type="button" class="modal-btn-cancel" (click)="c('Cancel click')">
      <i class="ft-x mr-1"></i> {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button type="button" class="btn btn-danger d-inline-flex align-items-center" style="height: 38px; border-radius: 8px; padding: 0 1.25rem; font-size: 13.5px; font-weight: 600;" (click)="deleteSelectedSetups()">
      <i class="ft-trash-2 mr-1"></i> {{ 'COMMON.DELETE' | translate }}
    </button>
  </div>
</ng-template>
