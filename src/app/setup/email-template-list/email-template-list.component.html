<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">{{ 'SETUP_MODULE.EMAIL_TEMPLATE_LIST' | translate }}</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div>
          <div class="d-flex justify-content-between align-items-center cstm-action-bar">
            <div>
              <button class="btn btn-lg mr-1" type="button" (click)="homePage()">
                <i class="ft-arrow-left"></i>
              </button>
              <span class="vl"></span>

              <!-- Create Template Button -->
              <button type="button" class="btn btn-sm cstm-ui-table-btn ml-2" appPermission
                [appPermFormId]="FORM_IDS.EMAIL_TEMPLATE_LIST" [appPermDisable]="'write'" (click)="createTemplate()">
                <i class="ft-edit"></i>
                <label class="ml-1">{{ 'SETUP_MODULE.CREATE_EMAIL_TEMPLATE' | translate }}</label>
              </button>

              <!-- Delete Template Button -->
              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="confirmDelete()" appPermission
                [appPermFormId]="FORM_IDS.EMAIL_TEMPLATE_LIST" [appPermDisable]="'delete'"
                [disabled]="isDeleteButtonDisabled">
                <i class="ft-trash-2"></i>
                <label class="ml-1">{{ 'COMMON.DELETE' | translate }}</label>
              </button>

              <!-- Edit Template Button -->
              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="editTemplate()" appPermission
                [appPermFormId]="FORM_IDS.EMAIL_TEMPLATE_LIST" [appPermDisable]="'write'"
                [disabled]="isEditButtonDisabled">
                <i class="ft-edit"></i>
                <label class="ml-1">{{ 'COMMON.EDIT' | translate }}</label>
              </button>
            </div>

            <div class="d-flex align-items-center">
              <button type="button" class="btn btn-sm cstm-ui-table-btn mr-2" (click)="toggleFilterBar()">
                <i class="ft-sliders"></i><label class="ml-1 btn-label">{{ 'COMMON.FILTER' | translate }}</label>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="showFilterBar" class="filter-bar">
        <div class="d-flex align-items-center justify-content-between pl-3 pr-1 py-2 filter-wrapper">
          <div class="filter-search">
            <i class="ft-filter search-icon"></i>
            <input style="padding-left: 3.4em;" type="text" class="form-control border-left-0 cstm-ui-input"
              [placeholder]="'COMMON.SEARCH' | translate" [(ngModel)]="searchTerm" (ngModelChange)="applySearchFilter()" />

          </div>

          <div class="d-flex filter-btns-div">
            <div class="dropdown filter-dropdown" ngbDropdown [ngbTooltip]="statusTouched ? ('COMMON.TYPE' | translate) : null">
              <button class="btn btn-sm filter-btn dropdown-toggle" ngbDropdownToggle>
                <span class="filter-label">{{ !statusTouched ? ("COMMON.TYPE" | translate) : selectedStatusLabel }} </span>
                <i class="ft-chevron-down"></i>
              </button>
              <div class="dropdown-menu" ngbDropdownMenu>
                <button class="dropdown-item" (click)="filterByWorkFlowType('All')">{{ 'COMMON.ALL' | translate }}</button>
                <button class="dropdown-item" (click)="filterByWorkFlowType('Vendor Company Onboarding')">Sourcing
                  Company
                  Onboarding</button>
                <button class="dropdown-item" (click)="filterByWorkFlowType('Request for quotation')">Request for
                  quotation</button>
                <button class="dropdown-item" (click)="filterByWorkFlowType('Purchase Request')">Purchase
                  Request</button>
              </div>
            </div>

            <button class="btn px-1 btn-sm" (click)="showFilterBar = false">✕</button>
          </div>
        </div>
      </div>

      <!-- Datatable -->
      @if(datatableVisible){
      <ngx-datatable autoResize (autoResize)="onAutoResize()" class="bootstrap core-bootstrap" [rows]="rows"
        [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" rowHeight="auto"
        [limit]="query.pageSize" [count]="totalItems" [externalPaging]="true" [offset]="query.currentPage - 1"
        (page)="onPageChange($event)" [scrollbarH]="true" [loadingIndicator]="loading" [selected]="chkBoxSelected"
        [swapColumns]="false" [selectionType]="SelectionType.checkbox" (sort)="onSort($event)"
        (select)="customChkboxOnSelect($event)">


        <!-- Checkbox Column -->
        <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false" [draggable]="false"
          [resizeable]="false">
          <ng-template ngx-datatable-header-template>
            <!-- <div class="custom-control cstm-checkbox-form">
              <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll($event)" />
            </div> -->
          </ng-template>
          <ng-template ngx-datatable-cell-template let-isSelected="isSelected"
            let-onCheckboxChangeFn="onCheckboxChangeFn">
            <div class="custom-control custom-checkbox cstm-checkbox-form">
              <input type="checkbox" [checked]="isSelected" (change)="onCheckboxChangeFn($event)" />
            </div>
          </ng-template>
        </ngx-datatable-column>

        <!-- Sr No -->
        <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [width]="50" [resizeable]="false">
          <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
            <span>{{ rowIndex + 1 }}</span>
          </ng-template>
        </ngx-datatable-column>

        <!-- Columns -->
        <ngx-datatable-column [name]="'TENDERING_MODULE.SUBJECT' | translate" prop="subject" [width]="180">
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'CONFIG_MODULE.BODY' | translate" prop="body" [width]="220">
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'COMMON.TYPE' | translate" prop="workFlowType" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'COMMON.ENTITY' | translate" prop="procurementCompany" [width]="150">
        </ngx-datatable-column>

      </ngx-datatable>
      }

    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <ng-template #confirmDeleteModal let-modal>
    <div class="modal-header d-flex align-items-center justify-content-between">
      <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
        <i class="ft-trash-2 mr-2 text-white"></i> {{ 'COMMON.CONFIRM_DELETE' | translate }}
      </h5>
      <button type="button" class="modal-close-btn" aria-label="Close" (click)="modal.dismiss()">
        <i class="ft-x"></i>
      </button>
    </div>
    <div class="modal-body">
      <p>{{ 'SETUP_MODULE.DELETE_TEMPLATE_CONFIRM' | translate }}</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="modal-btn-cancel" (click)="modal.dismiss()">
        <i class="ft-x mr-1"></i> {{ 'COMMON.CANCEL' | translate }}
      </button>
      <button type="button" class="btn btn-danger d-inline-flex align-items-center" style="height: 38px; border-radius: 8px; padding: 0 1.25rem; font-size: 13.5px; font-weight: 600;" (click)="deleteTemplateConfirmed()">
        <i class="ft-trash-2 mr-1"></i> {{ 'COMMON.DELETE' | translate }}
      </button>
    </div>
  </ng-template>

</section>
