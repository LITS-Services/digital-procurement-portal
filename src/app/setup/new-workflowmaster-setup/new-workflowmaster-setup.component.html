<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">
            {{ (mode === 'Edit' ? 'SETUP_MODULE.EDIT_WORKFLOW' : 'SETUP_MODULE.CREATE_WORKFLOW') | translate }}
          </h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card sticky-toolbar" [class.sticky]="isToolbarSticky">
        <div class="row">
          <div class="col-md-6">
            <button class="btn btn-lg mr-1" type="button" (click)="homePage()">
              <img src="assets/img/svg-icons/back-icon.svg" class="btn-back-icon" alt="Back" />
            </button>
            <span class="vl"></span>
            <button type="submit" class="btn btn-sm cstm-ui-table-btn" [disabled]="workflowsetupform.invalid"
              *ngIf="mode !== 'Edit'" (click)="submitForm()">
              <img src="assets/img/svg-icons/save-icon.svg" class="btn-action-icon" alt="" /><label>{{ 'COMMON.SAVE' | translate }}</label>
            </button>
            <button *ngIf="mode === 'Edit'" type="reset" class="btn btn-sm cstm-ui-table-btn"
              (click)="updateForm()">
              <img src="assets/img/svg-icons/update-icon.svg" class="btn-action-icon" alt="" /><label>{{ 'COMMON.UPDATE' | translate }}</label>
            </button>
            <button *ngIf="mode === 'Edit'" type="reset" class="btn btn-sm cstm-ui-table-btn">
              <img src="assets/img/svg-icons/delete-icon.svg" class="btn-action-icon" alt="" /><label>{{ 'COMMON.DELETE' | translate }}</label>
            </button>
          </div>
        </div>
      </div>

      <div class="card  sticky-toolbar-target">
        <div class="card-body">
          <form [formGroup]="workflowsetupform" (ngSubmit)="submitForm()">
            <div class="row gx-2">

              <!-- Basic Fields -->
              <div class="col-lg-4 mb-2">
                <label>{{ 'SETUP_MODULE.WORKFLOW_NAME' | translate }}</label>
                <input type="text" class="form-control custom-input" formControlName="workflowName"
                  [placeholder]="'SETUP_MODULE.WORKFLOW_NAME' | translate" required>
              </div>

              <div class="col-lg-4 mb-2">
                <label>{{ 'SETUP_MODULE.DOCUMENT_TYPE' | translate }}</label>
                <select class="form-control custom-input" formControlName="documentType">
                  <option value="" disabled>{{ 'CONFIG_MODULE.SELECT_TYPE' | translate }}</option>
                  <option *ngFor="let wf of workflowTypes" [value]="wf.id">{{ wf.typeName }}</option>
                </select>
              </div>

              <!-- Workflow Initiator(s) -->
              <div class="col-lg-4 mb-2">
                <div class="form-group mb-2">
                  <label>{{ (isVendorOnboarding ? 'SETUP_MODULE.SELECT_ENTITY' : 'SETUP_MODULE.WORKFLOW_INITIATORS') | translate }}</label>

                  <ng-select class="custom-style" [items]="isVendorOnboarding ? entitiesList : usersList"
                    [bindLabel]="isVendorOnboarding ? 'name' : 'userName'" bindValue="id"
                    [multiple]="!isVendorOnboarding" [closeOnSelect]="isVendorOnboarding" [searchable]="true"
                    [placeholder]="(isVendorOnboarding ? 'SETUP_MODULE.SELECT_ENTITY' : 'SETUP_MODULE.SELECT_USERS') | translate"
                    formControlName="usersList" (change)="isVendorOnboarding ? onEntitySelected($event?.id) : null">
                  </ng-select>

                </div>
              </div>

            </div>

            <div class="row gx-2">
              <!-- Switches -->
              <div class="col-lg-4 mb-3">
                <div class="custom-control custom-switch">
                  <input type="checkbox" class="custom-control-input me-1" id="status" formControlName="status">
                  <label class="custom-control-label" for="status">{{ 'COMMON.STATUS' | translate }}</label>
                  <input type="checkbox" class="custom-control-input ms-1 me-1" id="enableBulkUpload" formControlName="enableBulkUpload">
                  <label class="custom-control-label" for="enableBulkUpload">{{ 'SETUP_MODULE.ENABLE_BULK_UPLOAD' | translate }}</label>
                </div>
              </div>
            </div>
          </form>

          <div ngbAccordion class="address-card" #accordion="ngbAccordion">
            <!-- You can set [collapsed]="false" if you want it open by default -->
            <div ngbAccordionItem [collapsed]="false" id="ngb-panel-0">
              <h2 ngbAccordionHeader>
                <button ngbAccordionButton type="button" class="w-100 p-0 bg-transparent border-0">
                  <div class="row">
                    <div class="col-md-12 d-flex justify-content-between align-items-center">
                      <span class="panel-icon">
                        <label class="text-white px-1 mb-1">{{ 'SETUP_MODULE.ADD_APPROVER' | translate }}</label>
                      </span>

                      <!-- your icon (bootstrap adds its own arrow too unless you hide it via css) -->
                      <i class="ft ft-chevron-down accordion-chevron"></i>
                    </div>
                  </div>
                </button>
              </h2>

              <div ngbAccordionCollapse>
                <div ngbAccordionBody>
                  <!-- ✅ REQUIRED in ng-bootstrap v15+ template -->
                  <ng-template>
                    <div class="card-accordion">
                      <div class="row gx-2 position-relative" [formGroup]="approverForm">

                        <button type="button" class="btn w-auto btn-primary position-absolute"
                          style="top: 0; right: 0; z-index: 10;     margin-right: 21px" (click)="addApprover()">
                          <i class="ft-pocket mr-1"></i> {{ 'COMMON.ADD' | translate }}
                        </button>

                        <div class="col-12 mt-5">
                        </div>

                        <div class="col-lg-6 col-md-5 col-sm-5 col-xs-6">
                          <div class="form-group mb-2">
                            <label>{{ 'SETUP_MODULE.APPROVER' | translate }}</label>
                            <select class="form-control custom-input" formControlName="approverList">
                              <option value="" disabled>{{ 'SETUP_MODULE.SELECT_APPROVER' | translate }}</option>
                              <option *ngFor="let approver of approverList" [value]="approver.id">
                                {{ approver.userName }}
                              </option>
                            </select>
                          </div>
                        </div>

                        <!-- Amount From & To: hide for Vendor Company Onboarding -->
                        <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2">
                          <div class="form-group mb-2">
                            <label>{{ 'SETUP_MODULE.AMOUNT_FROM' | translate }}</label>
                            <input type="number" [placeholder]="'SETUP_MODULE.ENTER_AMOUNT' | translate" class="form-control custom-input"
                              formControlName="amountFrom" [disabled]="hideConditionalFields" />
                          </div>
                        </div>

                        <div class="col-lg-2 col-md-2 col-sm-2 col-xs-6">
                          <div class="form-group mb-2">
                            <label>{{ 'SETUP_MODULE.AMOUNT_TO' | translate }}</label>
                            <input type="number" [placeholder]="'SETUP_MODULE.ENTER_AMOUNT' | translate" class="form-control custom-input"
                              formControlName="amountTo" [disabled]="hideConditionalFields" />
                          </div>
                        </div>

                        <div class="col-lg-2 col-md-2 col-sm-2 col-xs-6">
                          <div class="form-group mb-2">
                            <label>{{ 'SETUP_MODULE.APPROVER_LEVEL' | translate }}</label>
                            <input type="number" [placeholder]="'SETUP_MODULE.ENTER_LEVEL' | translate" class="form-control custom-input"
                              formControlName="approverLevel" />
                          </div>
                        </div>

                        <div class="col-lg-6 col-md-5 col-sm-5 col-xs-6">
                          <div class="form-group mb-2">
                            <label>{{ 'SETUP_MODULE.PROXY_APPROVER' | translate }}</label>
                            <select class="form-control custom-input" formControlName="proxyApproverId">
                              <option value="" disabled>{{ 'SETUP_MODULE.SELECT_PROXY_APPROVER' | translate }}</option>
                              <option *ngFor="let approver of approverList" [value]="approver.id">
                                {{ approver.userName }}
                              </option>
                            </select>
                          </div>
                        </div>

                        <div class="col-lg-2 col-md-2 col-sm-2 col-xs-6">
                          <div class="form-group mb-2">
                            <label>{{ 'SETUP_MODULE.GRACE_DAYS' | translate }}</label>
                            <input type="number" [placeholder]="'SETUP_MODULE.ENTER_GRACE_DAYS' | translate" class="form-control custom-input"
                              formControlName="graceDays" />
                          </div>
                        </div>

                        <!-- Switches -->
                        <div class="row gx-2 px-3 d-flex">
                          <div class="col-lg-2 mb-2">
                            <div class="custom-control custom-switch">
                              <input type="checkbox" class="custom-control-input me-1" id="canApprove"
                                formControlName="canApprove" />
                              <label class="custom-control-label" for="canApprove">{{ 'SETUP_MODULE.CAN_APPROVE' | translate }}</label>
                            </div>
                          </div>

                          <div class="col-lg-2 mb-2">
                            <div class="custom-control custom-switch">
                              <input type="checkbox" class="custom-control-input me-1" id="canReject"
                                formControlName="canReject" />
                              <label class="custom-control-label" for="canReject">{{ 'SETUP_MODULE.CAN_REJECT' | translate }}</label>
                            </div>
                          </div>

                          <div class="col-lg-2 mb-3">
                            <div class="custom-control custom-switch">
                              <input type="checkbox" class="custom-control-input me-1" id="canSendBack"
                                formControlName="canSendBack" />
                              <label class="custom-control-label" for="canSendBack">{{ 'SETUP_MODULE.CAN_SEND_BACK' | translate }}</label>
                            </div>
                          </div>

                          <div class="col-lg-2 mb-3">
                            <div class="custom-control custom-switch">
                              <input type="checkbox" class="custom-control-input me-1" id="canSubmit"
                                formControlName="canSubmit" />
                              <label class="custom-control-label" for="canSubmit">{{ 'SETUP_MODULE.CAN_SUBMIT' | translate }}</label>
                            </div>
                          </div>

                          <div class="col-lg-2 mb-3">
                            <div class="custom-control custom-switch">
                              <input type="checkbox" class="custom-control-input me-1" id="isApprovalCompulsory"
                                formControlName="isApprovalCompulsory" />
                              <label class="custom-control-label" for="isApprovalCompulsory">{{ 'SETUP_MODULE.IS_COMPULSORY' | translate }}</label>
                            </div>
                          </div>
                        </div>


                        <hr />
                      </div>


                    </div>
                  </ng-template>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12">
            <div style="position: relative;">
              <ngx-datatable class="bootstrap core-bootstrap" [rows]="newApproverData" [columnMode]="'force'"
                [headerHeight]="50" [footerHeight]="50" rowHeight="auto" [limit]="5" [scrollbarH]="true">
                <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [width]="75" [minWidth]="75" [canAutoResize]="false">
                  <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
                    <span>{{rowIndex + 1}}</span>
                  </ng-template>
                </ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.APPROVER' | translate" prop="approverName" [width]="120" [minWidth]="110"></ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.LEVEL' | translate" prop="approverLevel" [width]="90" [minWidth]="85"></ngx-datatable-column>

                <!-- Hide Amount From/To in table for Vendor Company Onboarding -->
                <ngx-datatable-column [name]="'SETUP_MODULE.AMOUNT_FROM' | translate" prop="amountFrom" [width]="135" [minWidth]="130"
                  *ngIf="!hideConditionalFields"></ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.AMOUNT_TO' | translate" prop="amountTo" [width]="125" [minWidth]="120"
                  *ngIf="!hideConditionalFields"></ngx-datatable-column>

                <ngx-datatable-column [name]="'SETUP_MODULE.PROXY_APPROVER' | translate" prop="proxyApproverName" [width]="155" [minWidth]="150">
                  </ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.GRACE_DAYS' | translate" prop="graceDays" [width]="125" [minWidth]="120"></ngx-datatable-column>

                <ngx-datatable-column [name]="'SETUP_MODULE.CAN_APPROVE' | translate" prop="canApprove" [width]="130" [minWidth]="125"></ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.CAN_REJECT' | translate" prop="canReject" [width]="120" [minWidth]="115"></ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.CAN_SEND_BACK' | translate" prop="canSendBack" [width]="140" [minWidth]="135"></ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.CAN_SUBMIT' | translate" prop="canSubmit" [width]="120" [minWidth]="115"></ngx-datatable-column>
                <ngx-datatable-column [name]="'SETUP_MODULE.IS_COMPULSORY' | translate" prop="isApprovalCompulsory" [width]="145" [minWidth]="140">
                  </ngx-datatable-column>

                <ngx-datatable-column [name]="'COMMON.ACTIONS' | translate" [width]="100" [minWidth]="95" [canAutoResize]="false">
                  <ng-template ngx-datatable-cell-template let-row="row" let-rowIndex="rowIndex">
                    <a matTooltip="Edit Approver" style="cursor: pointer; color: #d1d4d7;"
                      (click)="editRow(row, rowIndex)" [ngClass]="{'disabled': actionType === 'View'}">
                      <i style="font-size: 1.5rem;" class="ft-edit mr-1"></i>
                    </a>
                    <a matTooltip="Delete Approver" style="cursor: pointer; color: #d1d4d7;"
                      (click)="deleteRow(rowIndex)" [ngClass]="{'disabled': actionType === 'View'}">
                      <i style="font-size: 1.5rem;" class="ft-trash trash-icon"></i>
                    </a>
                  </ng-template>
                </ngx-datatable-column>

              </ngx-datatable>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
  <div *ngIf="dataLoaded; else loadingTemplate">
    <!-- Your main content here, e.g. the form, dropdowns, etc. -->
  </div>

  <ng-template #loadingTemplate>
    <div class="loading-spinner">
      {{ 'COMMON.LOADING' | translate }}
    </div>
  </ng-template>

</section>
