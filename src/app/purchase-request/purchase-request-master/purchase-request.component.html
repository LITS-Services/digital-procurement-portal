<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">Purchase Request</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div>
          <div class="d-flex justify-content-between align-items-center cstm-action-bar">

            <div>
              <button class="btn btn-lg mr-1" type="button" (click)="homePage()">
                <img src="assets/img/svg-icons/back-icon.svg" class="btn-back-icon" alt="Back" />
              </button>

              <span class="vl"></span>

              <button type="button" class="btn btn-sm cstm-ui-table-btn" ngbTooltip="Create new Purchase Request"
                appPermission [appPermFormId]="FORM_IDS.PURCHASE_REQUEST" [appPermDisable]="'write'" [appPermHide]="true"
                (click)="openEmpDetails()">
                <img src="assets/img/svg-icons/create-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Create</label>
              </button>

              <ng-container *ngIf="chkBoxSelected?.length > 0">
                <button *ngIf="!isEditButtonDisabled" type="button" class="btn btn-sm cstm-ui-table-btn"
                  (click)="onUpdate()" appPermission [appPermFormId]="FORM_IDS.PURCHASE_REQUEST"
                  [appPermDisable]="'write'" [appPermHide]="true">
                  <img src="assets/img/svg-icons/update-icon.svg" class="btn-action-icon" alt="" />
                  <label class="btn-label">Update</label>
                </button>

                <button *ngIf="!isDeleteButtonDisabled" type="button" class="btn btn-sm cstm-ui-table-btn"
                  (click)="openDeleteModal()" appPermission [appPermFormId]="FORM_IDS.PURCHASE_REQUEST"
                  [appPermDisable]="'delete'" [appPermHide]="true">
                  <img src="assets/img/svg-icons/delete-icon.svg" class="btn-action-icon" alt="" />
                  <label class="btn-label">Delete</label>
                </button>

                <button *ngIf="canSubmitForApprovalFromListUi()" type="button" class="btn btn-sm cstm-ui-table-btn"
                  (click)="onSubmitForApprovalFromList()">
                  <img src="assets/img/svg-icons/Submit_icon.svg" class="btn-action-icon" alt="" />
                  <label class="btn-label">Submit for Approval</label>
                </button>
              </ng-container>

              <button type="button" class="btn btn-sm cstm-ui-table-btn" [disabled]="syncLoading" (click)="onSyncNow()">
                <img src="assets/img/svg-icons/Sync_icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Sync Now</label>
              </button>

            </div>

            <div class="d-flex align-items-center pr-actions-right">

              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="toggleFilterBar()">
                <img src="assets/img/svg-icons/filter-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Filter</label>
              </button>

              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="openExceptionPolicyModal()">
                <img src="assets/img/svg-icons/Exception-Policy-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Exception Policy</label>
              </button>

              <button type="button" class="btn btn-sm cstm-ui-table-btn" (click)="openAblModal()">
                <img src="assets/img/svg-icons/lockup-icon.svg" class="btn-action-icon" alt="" />
                <label class="btn-label">Account Budget Lookup</label>
              </button>

            </div>

          </div>

        </div>
      </div>

      <!-- Data Table -->
      <div *ngIf="showFilterBar" class="filter-bar">
        <div class="d-flex align-items-center justify-content-between pl-3 pr-1 py-2 filter-wrapper">
          <div class="filter-search">
          </div>

          <div class="d-flex filter-btns-div">
            <div class="dropdown filter-dropdown" ngbDropdown [ngbTooltip]="statusTouched ? 'Status' : null">
              <button class="btn btn-sm filter-btn dropdown-toggle" ngbDropdownToggle>
                <span class="filter-label">{{ !statusTouched ? "Status" : selectedStatusLabel }} </span>
                <i class="ft-chevron-down"></i>
              </button>
              <div class="dropdown-menu" ngbDropdownMenu>
                <button type="button" class="dropdown-item" [class.active]="!statusTouched || selectedStatusLabel === 'All'" (click)="onStatusChange('All')">
                  <span>All</span>
                  <i *ngIf="!statusTouched || selectedStatusLabel === 'All'" class="ft ft-check chart-check-icon"></i>
                </button>
                <button type="button" class="dropdown-item" *ngFor="let s of status" [class.active]="statusTouched && selectedStatusLabel === s.description" (click)="onStatusChange(s)">
                  <span>{{ s.description }}</span>
                  <i *ngIf="statusTouched && selectedStatusLabel === s.description" class="ft ft-check chart-check-icon"></i>
                </button>
              </div>
            </div>

            <button class="btn px-1 btn-sm" (click)="showFilterBar = false">✕</button>
          </div>

        </div>
      </div>
      <div class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
        <ngx-datatable
          #datatable
          class="bootstrap core-bootstrap"
          [rows]="purchaseRequestData"
          [columnMode]="'force'"
          [headerHeight]="50"
          [footerHeight]="50"
          [rowHeight]="'auto'"
          [scrollbarH]="isMobile"
          [limit]="query.pageSize"
          [count]="totalItems"
          [externalPaging]="true"
          [offset]="query.currentPage - 1"
          (page)="onPageChange($event)"
          [loadingIndicator]="loading"
          [selected]="chkBoxSelected"
          [selectionType]="SelectionType.checkbox"
          (sort)="onSort($event)"
          (select)="customChkboxOnSelect($event)">

          <!-- Checkbox Column -->
          <ngx-datatable-column
            [width]="50"
            [sortable]="false"
            [canAutoResize]="false"
            [draggable]="false"
            [resizeable]="false"
            cellClass="datatable-checkbox-cell"
            headerClass="datatable-checkbox-cell">
            <ng-template ngx-datatable-header-template>
              <div class="custom-control cstm-checkbox-form">
                <input
                  type="checkbox"
                  class="cstm-checkbox-form"
                  [checked]="isAllSelected"
                  (change)="toggleSelectAll($event)" />
              </div>
            </ng-template>

            </ng-template>
          </ngx-datatable-column>

          <!-- Sr. No -->
          <ngx-datatable-column
            name="Sr. No."
            [width]="90"
            [minWidth]="90"
            [canAutoResize]="false"
            [draggable]="false"
            [resizeable]="false">
            <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
              <span>{{ rowIndex + 1 }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Requisition No -->
          <ngx-datatable-column
            name="Requisition No."
            prop="requisitionNo"
            [flexGrow]="2"
            [minWidth]="140">
            <ng-template ngx-datatable-cell-template let-row="row">
              <a href="javascript:void(0)" (click)="openPr(row)" appPermission
                [appPermFormId]="FORM_IDS.PURCHASE_REQUEST" [appPermDisable]="'read'">
                {{ row.requisitionNo }}
              </a>
            </ng-template>
          </ngx-datatable-column>

          <!-- Status -->
          <ngx-datatable-column
            name="Status"
            prop="requestStatus"
            [flexGrow]="1"
            [minWidth]="120">
            <ng-template ngx-datatable-cell-template let-row="row">
              <span [ngClass]="row.statusClass">
                {{ row.requestStatus }}
              </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Date -->
          <ngx-datatable-column
            name="Date"
            prop="submittedDate"
            [flexGrow]="1"
            [minWidth]="120">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.submittedDate | date:'yyyy-MM-dd' }}
            </ng-template>
          </ngx-datatable-column>

          <!-- Entity -->
          <ngx-datatable-column
            name="Entity"
            prop="entityName"
            [flexGrow]="2"
            [minWidth]="150">
          </ngx-datatable-column>

          <!-- Department -->
          <ngx-datatable-column
            name="Department"
            prop="department"
            [flexGrow]="2"
            [minWidth]="150">
          </ngx-datatable-column>

          <!-- Action -->
          <ngx-datatable-column
            name="Action"
            [width]="90"
            [canAutoResize]="false"
            [draggable]="false"
            [resizeable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>

              <button
                type="button"
                class="btn btn-sm table-action-btn"
                [ngbPopover]="actionToolbar"
                popoverClass="action-popover"
                placement="auto bottom"
                container="body">
                <img src="assets/img/svg-icons/3-dots.svg" class="action-dots-icon" alt="" />
              </button>

              <!-- FULL POPOVER -->
              <ng-template #actionToolbar>
                <div class="d-flex justify-content-around flex-column">

                  <!-- Approval History -->
                  <button
                    class="btn popover-btn btn-sm m-1"
                    ngbTooltip="Approval History"
                    appPermission
                    [appPermFormId]="FORM_IDS.PURCHASE_REQUEST"
                    [appPermDisable]="'read'"
                    (click)="openApprovalHistoryModal(row)">
                    <span class="popover-icon"><i class="ft-list"></i></span>
                    Approval History
                  </button>

                  <!-- Generate RFQ -->
                  <button
                    *ngIf="row.requestStatus === 'Completed' && row.isInventoryTransfer !== true; else rfqDisabled"
                    class="btn popover-btn btn-sm m-1"
                    ngbTooltip="Generate RFQ"
                    (click)="generateRfq(row)"
                    appPermission
                    [appPermFormId]="FORM_IDS.PURCHASE_REQUEST"
                    [appPermDisable]="'write'">
                    <span class="popover-icon"><i class="ft-file-text"></i></span>
                    Generate RFQ
                  </button>

                  <ng-template #rfqDisabled>
                    <button
                      class="btn popover-btn btn-sm m-1"
                      disabled
                      [ngbTooltip]="row.requestStatus !== 'Completed'
                        ? 'RFQ can only be generated when PR is Completed.'
                        : 'RFQ cannot be generated since Inventory Transfer is created.'">
                      <span class="popover-icon"><i class="ft-file-text" style="opacity: 0.5;"></i></span>
                      Generate RFQ
                    </button>
                  </ng-template>

                  <!-- Request / Create Purchase Order (conditional based on data source settings) -->
                  <button
                    *ngIf="row.requestStatus === 'Completed' && row.isInventoryTransfer !== true; else selectVendorDisabled"
                    class="btn popover-btn btn-sm m-1"
                    [ngbTooltip]="useRequestPOMode ? 'Request Purchase Order' : 'Create Purchase Order'"
                    (click)="onPurchaseOrderAction(row)"
                    appPermission
                    [appPermFormId]="FORM_IDS.PURCHASE_REQUEST"
                    [appPermDisable]="'write'">
                    <span class="popover-icon"><i class="ft-shopping-cart"></i></span>
                    {{ useRequestPOMode ? 'Request Purchase Order' : 'Create Purchase Order' }}
                  </button>

                  <ng-template #selectVendorDisabled>
                    <button
                      class="btn popover-btn btn-sm m-1"
                      disabled
                      [ngbTooltip]="row.requestStatus !== 'Completed'
                        ? (useRequestPOMode ? 'Purchase Order can only be requested when PR is Completed.' : 'Purchase Order can only be created when PR is Completed.')
                        : (useRequestPOMode ? 'Purchase Order cannot be requested since Inventory Transfer is created.' : 'Purchase Order cannot be created since Inventory Transfer is created.')">
                      <span class="popover-icon"><i class="ft-shopping-cart" style="opacity: 0.5;"></i></span>
                      {{ useRequestPOMode ? 'Request Purchase Order' : 'Create Purchase Order' }}
                    </button>
                  </ng-template>

                  <!-- Inventory Transfer -->
                  <button
                    *ngIf="row.requestStatus === 'Completed'; else inventoryTransferWaitingTemplate"
                    class="btn popover-btn btn-sm m-1"
                    ngbTooltip="Create Inventory Transfer"
                    (click)="openPRInventoryManagement(row)"
                    appPermission
                    [appPermFormId]="FORM_IDS.PURCHASE_REQUEST"
                    [appPermDisable]="'write'">
                    <span class="popover-icon"><i class="ft-repeat"></i></span>
                    Inventory Transfer
                  </button>

                  <ng-template #inventoryTransferWaitingTemplate>
                    <button
                      class="btn popover-btn btn-sm m-1"
                      disabled
                      ngbTooltip="Inventory Transfer can only be created when PR is Completed.">
                      <span class="popover-icon"><i class="ft-repeat" style="opacity: 0.5;"></i></span>
                      Inventory Transfer
                    </button>
                  </ng-template>

                </div>
              </ng-template>
              <!-- /FULL POPOVER -->

            </ng-template>
          </ngx-datatable-column>

        </ngx-datatable>
      </div>

    </div>
  </div>
</section>

<!-- Sync Now Modal -->
<ng-template #syncModal let-modal>
  <div class="modal-header d-flex align-items-center justify-content-between">
    <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
      <i class="ft-refresh-cw mr-2 text-white"></i> Sync Now
    </h5>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="modal.dismiss()">
      <i class="ft-x"></i>
    </button>
  </div>
  <div class="modal-body">
    <p>{{ syncMessage }}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="modal-btn-save" (click)="modal.close()">
      <i class="fa fa-check mr-1"></i> OK
    </button>
  </div>
</ng-template>
