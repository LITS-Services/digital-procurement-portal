<div class="modal-header d-flex align-items-center justify-content-between">
    <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
        <i class="ft-clock mr-2 text-white"></i> {{ 'COMMON.APPROVAL_HISTORY' | translate }} - {{ requisitionNo }}
    </h5>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeDialog()">
        <i class="ft-x"></i>
    </button>
</div>

<div class="modal-body">
    <ngx-datatable class="bootstrap core-bootstrap" [rows]="approvalHistory" [columnMode]="'force'" [headerHeight]="50"
        [footerHeight]="40" [rowHeight]="50" [limit]="5">

        <ngx-datatable-column [name]="'COMMON.APPROVER' | translate" prop="approverName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'COMMON.REMARKS' | translate" prop="remarks"></ngx-datatable-column>
        <ngx-datatable-column [name]="'COMMON.APPROVAL_DATE' | translate" prop="createdDate">
            <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row.createdDate | date:'yyyy-MM-dd' }}
            </ng-template>
        </ngx-datatable-column>
    </ngx-datatable>

    <!-- <div *ngIf="loading" class="text-center mt-3">
        <span class="spinner-border spinner-border-sm"></span> Loading...
    </div> -->
</div>

<div class="modal-footer">
    <button type="button" class="modal-btn-cancel" (click)="closeDialog()">
        <i class="ft-x mr-1"></i> {{ 'COMMON.CLOSE' | translate }}
    </button>
</div>
