<div class="modal-header d-flex align-items-center justify-content-between">
  <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
    <i class="ft-message-square mr-2 text-white"></i> {{ 'COMMON.REMARKS' | translate }} - {{ action | statusTranslate }}
  </h5>
  <button type="button" class="modal-close-btn" aria-label="Close" (click)="cancel()">
    <i class="ft-x"></i>
  </button>
</div>

<div class="modal-body">
  <textarea [(ngModel)]="remarks"
            class="form-control"
            [placeholder]="'COMMON.REMARKS' | translate"></textarea>
</div>

<div class="modal-footer">
  <button type="button" class="modal-btn-cancel" (click)="cancel()">
    <i class="ft-x mr-1"></i> {{ 'COMMON.CANCEL' | translate }}
  </button>
  <button type="button" class="modal-btn-save" (click)="saveRemarks()">
    <i class="fa fa-save mr-1"></i> {{ action | statusTranslate }}
  </button>
</div>
