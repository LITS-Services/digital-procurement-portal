<div class="modal-header d-flex align-items-center justify-content-between">
  <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
    <i class="ft-box mr-2 text-white"></i> {{ 'COMMON.INVENTORY_TRANSFER' | translate }}: {{ requisitionNo }}
  </h5>
  <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeDialog()">
    <i class="ft-x"></i>
  </button>
</div>

<!-- BODY: this will scroll vertically when content is tall or zoomed -->
<div class="modal-body" [formGroup]="headerForm">

  <!-- Header card -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row">
        <!-- <div class="col-lg-4 col-md-4 col-sm-6">
          <div class="form-group mb-2">
            <label>PR Number</label>
            <input type="text" readonly class="form-control custom-input" formControlName="prNumber" />
          </div>
        </div> -->

        <div class="col-lg-4 col-md-4 col-sm-6">
          <div class="form-group mb-2">
            <label>{{ 'COMMON.REQUISITION_NO' | translate }}</label>
            <input type="text" readonly class="form-control custom-input" formControlName="requisitionNumber" />
          </div>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-6">
          <div class="form-group mb-2">
            <label>{{ 'COMMON.RECEIVER_NAME' | translate }}</label>
            <input type="text" readonly class="form-control custom-input" formControlName="receiverName" />
          </div>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-6">
          <div class="form-group mb-2">
            <label>{{ 'COMMON.STATUS' | translate }}</label>
            <input type="text" readonly class="form-control custom-input" [value]="headerForm.get('status')?.value | statusTranslate" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Items grid -->
  <div class="card item-card">
    <div class="card-header py-1 d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-0">{{ 'COMMON.LINE_ITEMS' | translate }}</h5>
      </div>
      <div>
        <!-- <button class="btn btn-outline-secondary btn-sm mr-1" type="button">
          Add
        </button> -->
      </div>
    </div>

    <div class="card-body p-0">
      <div class="items-table-wrapper">
        <ngx-datatable class="bootstrap core-bootstrap" [rows]="items" [columnMode]="'force'" [headerHeight]="45"
          [footerHeight]="0" [rowHeight]="'auto'" [limit]="5">

          <!-- Sr No -->
          <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" prop="srNo" [width]="40">
          </ngx-datatable-column>

          <!-- Type -->
          <ngx-datatable-column [name]="'COMMON.ITEM_TYPE' | translate" prop="type" [width]="70">
               <ng-template let-row="row" ngx-datatable-cell-template>
                <span class="cell-ellipsis" [ngbTooltip]="row.type" container="body">
                  {{ row.type }}
                </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Item -->
          <ngx-datatable-column [name]="'COMMON.ITEM' | translate" prop="itemName" [width]="150">
                 <ng-template let-row="row" ngx-datatable-cell-template>
                <span class="cell-ellipsis" [ngbTooltip]="row.item" container="body">
                  {{ row.item }}
                </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Description -->
          <ngx-datatable-column [name]="'COMMON.DESCRIPTION' | translate" prop="description">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <span class="cell-ellipsis" [ngbTooltip]="row.description" container="body">
                  {{ row.description }}
                </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Total Quantity -->
          <ngx-datatable-column [name]="'COMMON.QUANTITY' | translate" prop="orderQuantity" [width]="70">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.orderQuantity }}
            </ng-template>
          </ngx-datatable-column>

          <!-- Amount -->
          <ngx-datatable-column [name]="'COMMON.BUDGET_AMOUNT' | translate" prop="amount" [width]="70">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.amount | number }}
            </ng-template>
          </ngx-datatable-column>

          <!-- Remarks -->
          <ngx-datatable-column [name]="'COMMON.REMARKS' | translate" prop="remarks" [width]="150">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <span class="cell-ellipsis" [ngbTooltip]="row.remarks" container="body">
                  {{ row.remarks }}
                </span>
            </ng-template>
          </ngx-datatable-column>

   
          <ngx-datatable-column [name]="'COMMON.FROM_COMPANY' | translate" [width]="170">
            <ng-template let-row="row" let-i="rowIndex" ngx-datatable-cell-template>
          
              <div class="dropdown filter-dropdown w-100" [container]="'body'" ngbDropdown>
                <button
                  class="btn btn-sm filter-btn pr-select dropdown-toggle d-flex align-items-center justify-content-between w-100 pr-cell-dropdown"
                  ngbDropdownToggle
                  [ngbTooltip]="getCompanyName(itemForms.at(i).get('procurementCompanyId')?.value) || ('COMMON.FROM_COMPANY' | translate)"
                  container="body">

                  <span class="filter-label ellipsis-label">
                    {{ getCompanyName(itemForms.at(i).get('procurementCompanyId')?.value) || ('COMMON.FROM_COMPANY' | translate) }}
                  </span>
                        <i class="ft-chevron-down ml-1"></i>
                </button>
          
                <div class="dropdown-menu" ngbDropdownMenu>
                  <button class="dropdown-item border-bottom" (click)="setCompany(i, null)">
                  <i class="fa fa-times mr-1"></i>  {{ 'COMMON.CLEAR' | translate }}
                  </button>
          
                  <button class="dropdown-item" *ngFor="let c of procCompanies" (click)="setCompany(i, c)">
                    {{ c.description }}
                  </button>
                </div>
              </div>
          
            </ng-template>
          </ngx-datatable-column>


            <ngx-datatable-column [name]="'COMMON.FROM_ADDRESS' | translate" [width]="140">
              <ng-template let-row="row" let-i="rowIndex" ngx-datatable-cell-template>

                <div class="dropdown filter-dropdown w-100"
                    ngbDropdown
                    [container]="'body'">

                  <button
                    class="btn btn-sm filter-btn pr-select dropdown-toggle d-flex align-items-center justify-content-between w-100 pr-cell-dropdown"
                    ngbDropdownToggle
                    [disabled]="isAddressDisabled(i)"
                    [ngClass]="{ 'disabled-dropdown': isAddressDisabled(i) }"
                    [ngbTooltip]="isAddressDisabled(i) ? ('COMMON.ADDRESS_1' | translate) : (getAddressDescription(i) || ('COMMON.ADDRESS_1' | translate))"
                    container="body">

                    <span class="filter-label ellipsis-label">
                      {{ isAddressDisabled(i)
                          ? ('COMMON.ADDRESS_1' | translate)
                          : (getAddressDescription(i) || ('COMMON.ADDRESS_1' | translate)) }}
                    </span>

                    <i class="ft-chevron-down ml-1"></i>
                  </button>

                  <!-- Only show menu when enabled -->
                  <div class="dropdown-menu" ngbDropdownMenu *ngIf="!isAddressDisabled(i)">

                    <button *ngIf="itemForms.at(i).get('addresses')?.value?.length === 0" class="dropdown-item text-muted">
                        {{ 'COMMON.NO_DATA' | translate }}
                    </button>

                    <button
                      class="dropdown-item pr-drpdown"
                      *ngFor="let a of itemForms.at(i).get('addresses')?.value"
                      (click)="setAddress(i, a)"
                      [ngbTooltip]="a.description">
                      {{ a.description }}
                    </button>
                  </div>
                </div>

              </ng-template>
            </ngx-datatable-column>


            <ngx-datatable-column [name]="'COMMON.ATTACHMENTS' | translate" [width]="100">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <a [matTooltip]="'COMMON.ATTACHMENT' | translate" class="row-action-attachment" (click)="openAttachmentView(row)"
                [ngClass]="{'disabled': !row.hasAttachment}">
                <i style="font-size: 1.5rem;" class="ft-paperclip mr-1"></i>
              </a>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>

        <div *ngIf="loading" class="text-center mt-3 mb-2">
          <span class="spinner-border spinner-border-sm"></span> {{ 'COMMON.LOADING' | translate }}
        </div>
      </div>
    </div>
  </div>

</div>

<!-- FOOTER: absolute at bottom, always visible -->
<div class="modal-footer cstm-footer">
  <button type="button" class="modal-btn-cancel" (click)="closeDialog()">
    <i class="ft-x mr-1"></i> {{ 'COMMON.CLOSE' | translate }}
  </button>
  <button type="button" class="modal-btn-save" (click)="onSubmit()" appPermission [appPermFormId]="FORM_IDS.INVENTORY_TRANSFER"
    [appPermDisable]="'write'" [disabled]="itemForms.length === 0">
    <i class="fa fa-check mr-1"></i> {{ 'COMMON.SUBMIT_REQUISITION' | translate }}
  </button>
</div>
