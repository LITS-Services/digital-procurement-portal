  <div class="container">
    <header class="header">
      <h1>{{ 'VENDOR_REGISTRATION.TITLE' | translate }}</h1>
    </header>
  
    <main class="main-content">
      <form >

        <div class="row gx-2">
            <h5>{{ 'VENDOR_REGISTRATION.COMPANY_CONTACT_INFO' | translate }}</h5>
            <div class="col-md-12">
                <hr>
            </div>
            <div class="form-group col-md-12"> 
                <label for="vendorName">{{ 'VENDOR_REGISTRATION.ORG_NAME' | translate }}</label>
                <input type="text" id="vendorName" formControlName="organizationName" required>
            </div>
            <div class="form-group col-md-12"> 
                <label for="vendorAddress">{{ 'VENDOR_REGISTRATION.COMPANY_ADDRESS' | translate }}</label>
                <input type="text" id="vendorAddress" formControlName="companyAddress" required>
            </div>
            <div class="form-group col-md-12">
                <label for="vendorCountry">{{ 'SETUP_MODULE.BULK_COMPANY_UPLOAD_SEC.COUNTRY' | translate }}</label>
                <select id="vendorCountry"  (change)="onCountryChange($event)">
                  <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
                </select>
              </div>
        
              <!-- State/Province Selection -->
              <div class="form-group">
                <label for="vendorState">{{ 'VENDOR_REGISTRATION.STATE_PROVINCE' | translate }}</label>
                <select id="vendorState" formControlName="state" [disabled]="states.length === 0" (change)="onStateChange($event)">
                  <option *ngFor="let state of states" [value]="state">{{ state }}</option>
                </select>
              </div>
        
              <!-- City Selection -->
              <div class="form-group">
                <label for="vendorCity">{{ 'VENDOR_REGISTRATION.CITY' | translate }}</label>
                <select id="vendorCity" formControlName="city" [disabled]="cities.length === 0">
                  <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
                </select>
              </div>
        
              <!-- Postal/Zip Code -->
              <div class="form-group">
                <label for="vendorZipCode">{{ 'VENDOR_REGISTRATION.POSTAL_ZIP' | translate }}</label>
                <input type="text" id="vendorZipCode" formControlName="zipCode">
              </div>
            <div class="form-group col-md-6"> 
                <label for="vendorMobile">{{ 'VENDOR_REGISTRATION.MOBILE_NO' | translate }}</label>
                <input type="text" id="vendorMobile" formControlName="mobileNo" required>
            </div>
        </div>

        <div class="form-group">
          <button type="submit" [disabled]="!vendorForm.valid">{{ 'VENDOR_REGISTRATION.REGISTER' | translate }}</button>
        </div>
      </form>
    </main>
  
    <footer class="footer">
      <p>&copy; 2024 E-Procurement Portal. All rights reserved.</p>
    </footer>
  </div>
