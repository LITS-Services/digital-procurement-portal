<div class="modal-header d-flex align-items-center justify-content-between">
  <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
    <i class="ft-paperclip mr-2 text-white"></i> {{ 'COMMON.ATTACHMENT' | translate }}
  </h5>
  <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeDialog()">
    <i class="ft-x"></i>
  </button>
</div>
<div class="modal-body">
  <div class="col-12">
    <h5 *ngIf="!viewMode && !isStatusCompleted" class="heading-upload">{{ 'COMMON.UPLOAD_FILES' | translate }}</h5>
  </div>
  <!-- Your form fields and content -->
  <form [formGroup]="AttachmentForm">
    <div class="row gx-2">
      <!-- File Upload Button -->
      <div *ngIf="!viewMode && !isStatusCompleted" class="col-12 form-group mt-3">
        <input
          #fileInput
          type="file"
          (change)="onFileSelected($event)"
          [attr.aria-label]="'COMMON.CHOOSE_FILES' | translate"
          accept=".pdf,.doc,.docx,.xls,.xlsx,.csv"
          multiple
          hidden
        />

        <div
          class="upload-dropzone"
          role="button"
          tabindex="0"
          (click)="fileInput.click()"
          (keydown.enter)="fileInput.click()"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
          [class.upload-dropzone--disabled]="viewMode || isStatusCompleted"
        >
          <div class="upload-dropzone__content">
            <div class="upload-dropzone__icon">
              <i class="ft-upload-cloud"></i>
            </div>

            <div class="upload-dropzone__text">
              <div class="upload-dropzone__title">{{ 'COMMON.DROP_FILES_HERE' | translate }}</div>
              <div class="upload-dropzone__subtitle">
                {{ 'COMMON.OR_BROWSE' | translate }}
                <span class="d-block">{{ 'COMMON.ACCEPTED_FORMATS' | translate }}</span>
              </div>
            </div>

            <div class="upload-dropzone__action">
              <button
                type="button"
                class="btn btn-primary btn-sm"
                (click)="fileInput.click(); $event.stopPropagation()"
              >
                {{ 'COMMON.CHOOSE_FILES' | translate }}
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Textarea for additional information -->
      <!-- <div class="col-12 form-group mt-3">
        <label for="additionalInfo">Remarks</label>
        <textarea id="additionalInfo" formControlName="remarks" class="form-control" rows="3"
          placeholder="Enter any additional information here..."></textarea>
      </div> -->
      <div class="col-12 form-group mt-3" *ngIf="uploadedFiles.length > 0">
        <ngx-datatable class="bootstrap core-bootstrap" [rows]="uploadedFiles" [columnMode]="'standard'"
          [headerHeight]="50" [footerHeight]="50" rowHeight="auto" [limit]="5">

          <ngx-datatable-column [name]="'COMMON.SR_NO' | translate">
            <ng-template let-rowIndex="rowIndex" let-value="value" ngx-datatable-cell-template>
              <span>{{rowIndex + 1}}</span>
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column [name]="'COMMON.ITEM_TYPE' | translate" prop="contentType"  [width]="420">
          </ngx-datatable-column>
          <ngx-datatable-column [name]="'COMMON.FILE_NAME' | translate" prop="fileName">
          </ngx-datatable-column>
          <!-- <ngx-datatable-column name="Remarks" [width]="150" prop="remarks">
          </ngx-datatable-column> -->
          <ngx-datatable-column [name]="'COMMON.ACTIONS' | translate">
            <ng-template ngx-datatable-cell-template let-rowIndex="rowIndex">

              <a [matTooltip]="'COMMON.DOWNLOAD_FILE' | translate" class="row-action-edit" style="margin-right: 10px;"
                (click)="downloadAttachment(uploadedFiles[rowIndex])">
                <i style="font-size: 1.5rem;" class="ft-download"></i>
              </a>

              <a *ngIf="!viewMode" [matTooltip]="'COMMON.DELETE' | translate" class="row-action-delete" (click)="deleteRow(rowIndex)"
                [ngClass]="{'disabled':viewMode || uploadedFiles[rowIndex]?.isNew}">
                <i style="font-size: 1.5rem;" class="ft-trash trash-icon"></i>
              </a>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>

      </div>
      <div class="col-12 mt-3 text-center" *ngIf="uploadedFiles.length === 0 && viewMode">
  <p class="text-muted">{{ 'COMMON.NO_DATA' | translate }}</p>
</div>
    </div>

  </form>
</div>
<div class="modal-footer">
  <button type="button" class="modal-btn-cancel" (click)="closeDialog()">
    <i class="ft-x mr-1"></i> {{ (viewMode ? 'COMMON.CLOSE' : 'COMMON.CANCEL') | translate }}
  </button>
  <button *ngIf="!viewMode" type="button" class="modal-btn-save" (click)="uploadFiles()">
    <i class="fa fa-upload mr-1"></i> {{ 'COMMON.UPLOAD' | translate }}
  </button>
</div>
