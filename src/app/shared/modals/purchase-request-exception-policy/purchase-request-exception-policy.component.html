<div class="modal-header d-flex align-items-center justify-content-between">
  <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
    <i class="ft-alert-circle mr-2 text-white"></i> Exception Policy
  </h5>
  <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeDialog()">
    <i class="ft-x"></i>
  </button>
</div>
<div class="modal-body">
  <form [formGroup]="exceptionPolicyForm" (ngSubmit)="submitForm()">
    <div class="row gx-2">
      <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
        <div class="form-group mb-2">
          <label>Requisition No.</label>
          <input type="text" placeholder="Enter Requisition No." class="form-control" formControlName="requisitionNo"
            readonly />
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
        <div class="form-group mb-2">
          <label>Requester Name</label>
          <input type="text" placeholder="Enter Requester Name" class="form-control" formControlName="requesterName" />
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
        <div class="form-group mb-2">
          <label>Subject</label>
          <input type="text" placeholder="Enter Subject" class="form-control" formControlName="subject" />
        </div>
      </div>
      
      <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
        <div class="form-group mb-2">
          <label>Requesting Department</label>
          <input type="text" placeholder="Enter Requesting Department" class="form-control"
            formControlName="department" />
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
        <div class="form-group mb-2">
          <label>Description of Goods/Services</label>
          <input type="text" placeholder="Enter Description of Goods/Services" class="form-control"
            formControlName="description" />
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
        <div class="form-group mb-2">
          <label>Estimated/Actual Value</label>
          <input type="number" placeholder="Enter Estimated/Actual Value" class="form-control"
            formControlName="estimatedValue" />
        </div>
      </div>
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="form-group mb-2">
          <label>Proposed Alternative Methods of Procurement</label>
        </div>
      </div>

      <div class="col-12 mb-2">
        <div class="form-check-inline mr-4">
          <input
            type="checkbox"
            class="form-check-input"
            id="waiveApproval"
            formControlName="waiveApproval"
          />
          <label class="form-check-label" for="waiveApproval">
            Waive Approval
          </label>
        </div>
        <div class="form-check-inline">
          <input
            type="checkbox"
            class="form-check-input"
            id="waiveAmount"
            formControlName="waiveAmount"
          />
          <label class="form-check-label" for="waiveAmount">
            Waive Amount
          </label>
        </div>
      </div>

      
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="form-group mb-2">
          <label>Waiver Request Justification</label>
          <textarea name="" rows="5" type="text" placeholder="Enter Waiver Request Justification" class="form-control"
            formControlName="justification"></textarea>
        </div>
      </div>


    </div>

  </form>
</div>
<div class="modal-footer">
  <button type="button" class="modal-btn-cancel" (click)="closeDialog()">
    <i class="ft-x mr-1"></i> Cancel
  </button>
  <button *ngIf="!viewMode" type="button" class="modal-btn-save" (click)="submitForm()">
    <i class="fa fa-save mr-1"></i> Save
  </button>
</div>
