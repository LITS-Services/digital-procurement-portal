<!--Login Page Starts-->
<section id="login">
    <div class="auth-lang-switcher" ngbDropdown [display]="'dynamic'" (openChange)="langOpen = $event">
        <button type="button" class="auth-lang-dropdown-toggle" ngbDropdownToggle
            [title]="'SETTINGS.LANGUAGE' | translate">
            <i class="ft-globe auth-lang-globe-icon"></i>
            <span class="auth-lang-text">{{ currentLang === 'ar' ? 'العربية' : 'English' }}</span>
            <i class="ft-chevron-down auth-lang-chevron-icon" [class.rotate]="langOpen"></i>
        </button>

        <div class="dropdown-menu dropdown-menu-right auth-lang-dropdown-menu" ngbDropdownMenu>
            <button type="button" class="dropdown-item auth-lang-item" [class.active]="currentLang === 'en'"
                (click)="switchLanguage('en')">
                <span class="auth-lang-name">English</span>
                <i *ngIf="currentLang === 'en'" class="ft-check auth-lang-check-icon"></i>
            </button>
            <button type="button" class="dropdown-item auth-lang-item" [class.active]="currentLang === 'ar'"
                (click)="switchLanguage('ar')">
                <span class="auth-lang-name">العربية</span>
                <i *ngIf="currentLang === 'ar'" class="ft-check auth-lang-check-icon"></i>
            </button>
        </div>
    </div>
    <div class="row auth-height full-height-vh m-0">
        <div class="col-12 d-flex align-items-center justify-content-center">
            <div class="card overflow-hidden">
                <div class="card-content">
                    <div class="card-body auth-img">
                        <div class="row m-0">
                            <!-- <div class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center auth-img-bg p-3">
                <img src="assets/img/gallery/login.png" alt="" class="img-fluid" width="300" height="230">
              </div> -->
                            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-12 px-4 py-3">
                                <div class="text-center mb-2">
                                    <img class="login-logo" src="assets/img/logos/hts-logo.png" alt="HTS Procurement & Sourcing">
                                </div>

                                <router-outlet></router-outlet>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="semi-circle-img"></div>
    </div>



</section>
