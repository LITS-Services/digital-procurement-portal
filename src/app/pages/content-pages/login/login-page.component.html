<div class="d-flex flex-column justify-content-center align-items-center my-3 g-2">
  <div class="login-title">Login Now</div>
  <div class="login-desc">Please enter your credentials</div>
</div>

<div>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <input type="text" formControlName="username" class="form-control custom-input"
        placeholder="Enter your username"
        [ngClass]="{ 'is-invalid': (loginFormSubmitted && lf.username.invalid) || isLoginFailed, 'is-valid': loginFormSubmitted && !lf.username.invalid && !isLoginFailed }"
        (keyup.enter)="onSubmit()"
        required>
      <div *ngIf="loginFormSubmitted && (lf.username.invalid || lf.username.errors?.required)"
        class="help-block mt-1 text-danger"> <i class="ft-alert-circle align-middle"></i> This is required</div>
    </div>
    <div class="form-group cstm-pass-div">

      <div class="cstm-pass-input-wrap">
        <input type="{{ hidePassword ? 'password' : 'text' }}" formControlName="password"
          class="form-control custom-input" placeholder="Enter your password"
          [ngClass]="{ 'is-invalid': (loginFormSubmitted && lf.password.invalid) || isLoginFailed, 'is-valid': loginFormSubmitted && !lf.password.invalid && !isLoginFailed }"
          (keyup.enter)="onSubmit()"
          required>
        <i class="eye-icon pass-icon" [ngClass]="hidePassword ? 'ft ft-eye-off' : 'ft ft-eye'"
          (click)="togglePasswordVisibility()"></i>
      </div>

      <div *ngIf="loginFormSubmitted && (lf.password.invalid || lf.password.errors?.required)"
        class="help-block mt-1 text-danger"> <i class="ft-alert-circle align-middle"></i> This is required
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center my-3">
      <div class="checkbox auth-checkbox">
        <input type="checkbox" formControlName="rememberMe" class="form-control" id="rememberMe"
          (change)="rememberMe()">
        <label for="rememberMe" class="mb-0">
          <span class="font-small-2 font-weight-normal rm" style="color: #253E88;">Remember me</span>
        </label>
      </div>
      <a (click)="forgotpassword()" class="fp link">Forgot password?</a>
    </div>

    <div class="mb-3" *ngIf="isLocked">
      <p class="text-danger mb-0">
        This account is temporarily locked. Try again in
        <strong>{{ lockoutRemainingText || '—' }}</strong>
      </p>
    </div>

    <div class="mb-3 turnstile-wrap" *ngIf="turnstileVisible">
      <div id="turnstile-container" aria-live="polite"></div>
      <p class="text-muted small mt-2 mb-0" *ngIf="!turnstileToken && !turnstileLoadError">
        Complete the captcha to continue.
      </p>
      <p class="text-danger small mt-2 mb-0" *ngIf="turnstileLoadError">{{ turnstileLoadError }}</p>
      <button *ngIf="turnstileLoadError" type="button" class="btn btn-link btn-sm px-0 mt-1" (click)="retryCaptcha()">
        Retry captcha
      </button>
    </div>

    <div class="d-flex justify-content-between flex-sm-row">
      <button type="submit" class="btn login-btn w-100" [disabled]="isLocked || isSubmitting">Login</button>
    </div>
  </form>

  <div class="or-divider">
    <span>OR</span>
  </div>

  <div class="d-flex flex-sm-row">
    <a class="btn ms-login-btn ms-btn-color mt-1 w-100 align-self-center justify-content-center" (click)="SSO($event)">
      <i class="ms-logo mr-3"></i>
      <span>Login with Microsoft</span>
    </a>
  </div>
</div>

<div class="forgetPassword">
</div>
