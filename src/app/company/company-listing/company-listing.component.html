<section>
  <div class="row">
    <div class="col-12">

      <!-- Header -->
      <div class="row">
        <div class="col-md-12" style="margin-top: -0.25rem;">
          <h4 class="heading">{{ 'COMPANY_MODULE.SOURCING_COMPANIES' | translate }}</h4>
        </div>
      </div>

      <!-- Action Pane -->
      <div class="card cstm-ui-card">
        <div>
          <div class="d-flex justify-content-between align-items-center cstm-action-bar">
            <div>

              <button class="btn btn-lg mr-1 " type="button" (click)="homePage()">
                <i class="ft-arrow-left"></i></button>
              <span class="vl"></span>

              <!-- Company Review Button -->
              <button type="button" class="btn btn-sm cstm-ui-table-btn ml-2" [disabled]="isEditButtonDisabled"
                (click)="editSelectedRow()">
                <i class="ft-edit"></i>
                <label class="ml-1">{{ 'COMPANY_MODULE.COMPANY_REVIEW' | translate }}</label>
              </button>

            </div>
            <div class="d-flex align-items-center">
              <button type="button" class="btn btn-sm cstm-ui-table-btn mr-2" (click)="toggleFilterBar()">
                <i class="ft-sliders"></i><label class="ml-1 btn-label">{{ 'COMMON.FILTER' | translate }}</label>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="showFilterBar" class="filter-bar">
        <div class="d-flex align-items-center justify-content-between pl-3 pr-1 py-2 filter-wrapper">
          <div class="filter-search">
            <i class="ft-filter search-icon"></i>

            <input style="padding-left: 3.4em;" type="text" class="form-control border-left-0 cstm-ui-input"
              [placeholder]="'COMMON.SEARCH_ENTITY_COMPANY' | translate" [(ngModel)]="searchTerm"
              (ngModelChange)="applySearchFilter()" />

          </div>

          <div class="d-flex filter-btns-div">
            <div class="dropdown filter-dropdown" ngbDropdown [ngbTooltip]="statusTouched ? ('COMMON.STATUS' | translate) : null">
              <button class="btn btn-sm filter-btn dropdown-toggle" ngbDropdownToggle>
                <span class="filter-label">{{ !statusTouched ? ('COMMON.STATUS' | translate) : (selectedStatusLabel | statusTranslate) }} </span>
                <i class="ft-chevron-down"></i>
              </button>
              <div class="dropdown-menu" ngbDropdownMenu>
                <button class="dropdown-item" (click)="filterByStatus('All')">{{ 'COMMON.ALL' | translate }}</button>
                <button class="dropdown-item" (click)="filterByStatus('InProgress')">{{ 'COMMON.IN_PROGRESS' | translate }}</button>
                <button class="dropdown-item" (click)="filterByStatus('SendBack')">{{ 'COMMON.SENDBACK' | translate }}</button>
                <button class="dropdown-item" (click)="filterByStatus('New')">{{ 'COMMON.NEW' | translate }}</button>
                <button class="dropdown-item" (click)="filterByStatus('Rejected')">{{ 'COMMON.REJECTED' | translate }}</button>
                <button class="dropdown-item" (click)="filterByStatus('Onboarded')">{{ 'COMMON.ONBOARDED' | translate }}</button>
              </div>
            </div>

            <button class="btn px-1 btn-sm" (click)="showFilterBar = false">✕</button>
          </div>
        </div>
      </div>

      <!-- Table Content -->
      <div class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
        <ngx-datatable #datatable class="bootstrap core-bootstrap" [rows]="rows" [columnMode]="'force'"
          [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [limit]="pageSize"
          [count]="totalItems" [externalPaging]="true" [offset]="currentPage - 1" (page)="onPageChange($event)"
          [scrollbarH]="isMobile" [loadingIndicator]="loading" [selected]="chkBoxSelected" [swapColumns]="false"
          [selectionType]="SelectionType.checkbox" (sort)="onSort($event)" (select)="customChkboxOnSelect($event)">

          <!-- Checkbox Column -->
          <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false" [draggable]="false"
            [resizeable]="false">
            <ng-template ngx-datatable-header-template>
            </ng-template>
            <ng-template ngx-datatable-cell-template let-isSelected="isSelected"
              let-onCheckboxChangeFn="onCheckboxChangeFn">
              <div class="custom-control custom-checkbox cstm-checkbox-form">
                <input type="checkbox" [checked]="isSelected" (change)="onCheckboxChangeFn($event)" />
              </div>
            </ng-template>
          </ngx-datatable-column>

          <!-- Sr No Column -->
          <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [flexGrow]="1" [minWidth]="60" [maxWidth]="60" [resizeable]="false">
            <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
              <span>{{ rowIndex + 1 }}</span>
            </ng-template>
          </ngx-datatable-column>


          <!-- Company Name Column -->
          <ngx-datatable-column [name]="'COMMON.COMPANY' | translate" prop="name" [flexGrow]="2" [minWidth]="140">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <span>{{ row.name }}</span>
            </ng-template>
          </ngx-datatable-column>


          <!-- Conditionally Display Status Column -->
          <ngx-datatable-column *ngIf="showStatusColumn" [name]="'COMMON.STATUS' | translate" prop="companyStatus" [flexGrow]="1"
            [minWidth]="140">

            <ng-template ngx-datatable-cell-template let-row="row" let-value="value">
              <span class="status-pill" [ngClass]="getStatusClass(value)">
                {{ value | statusTranslate }}
              </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Action Column -->
          <ngx-datatable-column [name]="'COMMON.ACTION' | translate" [flexGrow]="1" [minWidth]="70" [maxWidth]="180" prop="action"
            [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button type="button" class="btn btn-sm btn-primary" [ngbPopover]="actionToolbar"
                popoverClass="action-popover" placement="bottom" container="body" [disabled]="!row.showAssignMe">
                <i class="ft-settings"></i>
              </button>

              <!-- Popover Template -->
              <ng-template #actionToolbar>
                <div class="d-flex justify-content-around flex-column">
                  <button class="btn popover-btn btn-sm m-1" [ngbTooltip]="'COMMON.ASSIGN_TO_ME' | translate" (click)="openAssignMeModal(row)"
                    *ngIf="row.showAssignMe">
                    <span class="popover-icon"><i class="ft-user-plus"></i></span>
                    {{ 'COMMON.ASSIGN_TO_ME' | translate }}
                  </button>
                </div>
              </ng-template>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>

    </div>
  </div>
</section>
