<div class="modal-header d-flex align-items-center justify-content-between">
    <h5 class="modal-title text-white font-weight-bold mb-0 d-flex align-items-center">
        <i class="ft-user-check mr-2 text-white"></i> Assign to Me - {{ companyName }}
    </h5>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="closeDialog()">
        <i class="ft-x"></i>
    </button>
</div>

<div class="modal-body">

    <!-- Already Assigned to ME Message -->
    <div *ngIf="isAssigned && isAssignedToMe" class="alert alert-info border-info">
        <strong>Already Assigned!</strong><br>
        This company is already assigned to you.
        <br><br>
        <!-- <div class="mt-2">
            <button class="btn btn-primary" (click)="closeDialog()">OK</button>
        </div> -->
    </div>

    <!-- Already Assigned to SOMEONE ELSE Message -->
    <div *ngIf="isAssigned && !isAssignedToMe && !showRemarks" class="alert border-warning">
        <strong>Already Assigned!</strong><br>
        This company is already assigned to:
        <b>{{ assignedUserName }}</b>
        <br>
        <span *ngIf="assignedUserRemarks">Remarks: {{ assignedUserRemarks }}</span>
        <br><br>
        Do you still want to assign it to yourself?

        <div class="mt-2">
            <button class="btn btn-sm btn-danger mr-2" (click)="yesProceed()">Yes</button>
            <button class="btn btn-sm btn-secondary" (click)="closeDialog()">No</button>
        </div>
    </div>

    <form *ngIf="!isAssignedToMe" [formGroup]="assignMeForm" (ngSubmit)="submitForm()">

        <!-- Remarks Section -->
        <div *ngIf="showRemarks">
            <div class="col-lg-12 mb-2">
                <label>Remarks <span class="text-danger">*</span></label>
                <textarea class="form-control custom-input" formControlName="remarks" placeholder="Enter remarks..."
                    rows="4" required>
                </textarea>

                <div *ngIf="assignMeForm.get('remarks')?.invalid && assignMeForm.get('remarks')?.touched"
                    class="text-danger small mt-1">
                    Remarks are required
                </div>
            </div>

            <!-- Error -->
            <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
            </div>

            <!-- Assign Button -->
            <div class="col-lg-12 mt-2">
                <button type="submit" class="btn btn-primary" [disabled]="assignMeForm.invalid || loading">
                    {{ loading ? 'Assigning...' : 'Assign to Me' }}
                    <span *ngIf="loading" class="spinner-border spinner-border-sm ml-2"></span>
                </button>
            </div>
        </div>

    </form>
</div>

<div class="modal-footer">
    <button type="button" class="modal-btn-cancel" (click)="closeDialog()" [disabled]="loading">
        <i class="ft-x mr-1"></i> Close
    </button>
</div>
